<!DOCTYPE html>
<html lang="en" data-theme="cyber-neon">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#08090c" id="metaThemeColor" />
<title>5-Second Rule | PartyDeck</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Space+Grotesk:wght@700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --font-body: 'Plus Jakarta Sans', system-ui, sans-serif;
  --font-display: 'Space Grotesk', system-ui, sans-serif;
  --font-mono: 'Space Mono', monospace;
  --r-sm: 8px; --r-md: 14px; --r-lg: 20px;
  --ease: cubic-bezier(.2,.8,.3,1);
}
[data-theme="cyber-neon"] {
  --bg-primary: #08090c; --bg-surface: #10141b; --bg-elevated: #181e29;
  --text-primary: #ffffff; --text-secondary: #9ba3b4; --text-muted: #5c6577;
  --accent: #00ffcc; --accent-glow: rgba(0,255,204,0.35); --accent-secondary: #ff007f;
  --danger: #ff0055; --success: #00ff66; --border-color: rgba(0,255,204,0.22);
  --card-shadow: 0 12px 32px rgba(0,0,0,0.8), 0 0 15px rgba(0,255,204,0.12);
}
[data-theme="sunset-rave"] {
  --bg-primary: #0f071d; --bg-surface: #1e0f38; --bg-elevated: #321659;
  --text-primary: #ffffff; --text-secondary: #d6b4fc; --text-muted: #8b62b8;
  --accent: #ff007f; --accent-glow: rgba(255,0,127,0.45); --accent-secondary: #ff8800;
  --danger: #ff0044; --success: #00ffaa; --border-color: rgba(255,0,127,0.3);
  --card-shadow: 0 12px 32px rgba(0,0,0,0.8), 0 0 15px rgba(255,0,127,0.2);
}
[data-theme="retro-arcade"] {
  --bg-primary: #12131c; --bg-surface: #1a1b28; --bg-elevated: #26273b;
  --text-primary: #f5f5f5; --text-secondary: #a2a8d3; --text-muted: #6873a8;
  --accent: #ffd400; --accent-glow: rgba(255,212,0,0.35); --accent-secondary: #ff3860;
  --danger: #ff3860; --success: #42e2b8; --border-color: rgba(255,212,0,0.25);
  --card-shadow: 0 12px 32px rgba(0,0,0,0.8), 0 0 15px rgba(255,212,0,0.15);
}
[data-theme="minimal-light"] {
  --bg-primary: #f4f6f9; --bg-surface: #ffffff; --bg-elevated: #e8ecf2;
  --text-primary: #101828; --text-secondary: #475467; --text-muted: #98a2b3;
  --accent: #2563eb; --accent-glow: rgba(37,99,235,0.2); --accent-secondary: #7c3aed;
  --danger: #d92d20; --success: #0f9d58; --border-color: rgba(16,24,40,0.15);
  --card-shadow: 0 8px 24px rgba(16,24,40,0.08);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg-primary);color:var(--text-primary);font-family:var(--font-body);overflow-x:hidden;-webkit-user-select:none;user-select:none;}

.pd-hud {
  position:sticky;top:0;z-index:40;background:var(--bg-surface);border-bottom:2px solid var(--border-color);
  padding:.55rem .85rem;padding-top:max(.55rem,env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;gap:.5rem;
}
.hud-exit {
  display:flex;align-items:center;gap:6px;background:var(--bg-elevated);color:var(--text-secondary);
  border:1px solid var(--border-color);border-radius:var(--r-sm);font-family:var(--font-mono);font-size:.7rem;font-weight:700;
  padding:.42rem .65rem;cursor:pointer;text-decoration:none;
}
.hud-exit:active{transform:scale(.96);}
.hud-mid{display:flex;flex-direction:column;align-items:center;min-width:0;}
.hud-badge{font-family:var(--font-mono);font-size:.56rem;font-weight:800;letter-spacing:.14em;color:var(--accent);white-space:nowrap;text-transform:uppercase;}
.hud-label{font-family:var(--font-display);font-size:.95rem;font-weight:800;max-width:44vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hud-count{font-family:var(--font-mono);font-size:.92rem;font-weight:700;color:var(--accent);background:var(--bg-elevated);border:1px solid var(--border-color);border-radius:var(--r-sm);padding:.28rem .55rem;min-width:62px;text-align:center;}

main{flex:1;max-width:640px;margin:0 auto;padding:1rem;padding-bottom:max(1.2rem,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:.9rem;}
.phase{display:none;flex-direction:column;gap:.9rem;flex:1;}
.phase.on{display:flex;animation:pFade .2s var(--ease);}
@keyframes pFade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.hero{display:flex;justify-content:center;color:var(--accent);margin-top:.2rem;}
.hero .ico{width:44px;height:44px;filter:drop-shadow(0 0 12px var(--accent-glow));}
h1.title{font-family:var(--font-display);font-size:1.55rem;font-weight:900;letter-spacing:-.02em;text-align:center;}
p.sub{text-align:center;font-size:.86rem;color:var(--text-secondary);max-width:46ch;margin:0 auto;line-height:1.45;}
.panel{background:var(--bg-surface);border:1px solid var(--border-color);border-radius:var(--r-md);padding:.9rem;box-shadow:var(--card-shadow);}
.ptitle{font-family:var(--font-mono);font-size:.64rem;text-transform:uppercase;letter-spacing:.14em;color:var(--text-muted);margin-bottom:.55rem;}

.btn{width:100%;min-height:50px;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:var(--bg-primary);border:none;border-radius:var(--r-sm);font-family:var(--font-mono);font-size:.88rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;box-shadow:0 0 16px var(--accent-glow);cursor:pointer;}
.btn:active{transform:scale(.98);}
.btn:disabled{opacity:.35;box-shadow:none;pointer-events:none;}
.btn.ghost{background:transparent;color:var(--text-secondary);border:1px solid rgba(255,255,255,.16);box-shadow:none;}
.btn.push{margin-top:auto;}
.btn-row{display:flex;gap:.6rem;}.btn-row>*{flex:1;}
.btn.success-btn{background:var(--success);color:#031;box-shadow:0 0 16px rgba(0,255,102,.3);}
.btn.fail-btn{background:var(--danger);color:#fff;box-shadow:0 0 16px rgba(255,0,85,.3);}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;}
.tile{background:var(--bg-elevated);border:1px solid var(--border-color);border-radius:var(--r-sm);padding:.8rem .5rem;color:var(--text-primary);font-family:var(--font-mono);font-size:.82rem;font-weight:700;text-align:center;cursor:pointer;}
.tile.is-on{background:var(--accent);color:var(--bg-primary);box-shadow:0 0 10px var(--accent-glow);}

.prompt-banner{background:var(--bg-elevated);border:1px solid var(--border-color);border-radius:var(--r-md);padding:1.2rem 1rem;text-align:center;}
.prompt-tag{font-family:var(--font-mono);font-size:.62rem;letter-spacing:.16em;color:var(--accent);text-transform:uppercase;}
.prompt-text{font-family:var(--font-display);font-size:1.35rem;font-weight:900;line-height:1.35;margin-top:.4rem;}

.timer-wrap{display:flex;flex-direction:column;align-items:center;gap:.4rem;padding:.4rem 0;}
.timer-ring{position:relative;width:150px;height:150px;}
.timer-ring svg{transform:rotate(-90deg);width:150px;height:150px;}
.tr-bg{fill:none;stroke:var(--bg-elevated);stroke-width:10;}
.tr-fg{fill:none;stroke:var(--accent);stroke-width:10;stroke-linecap:round;stroke-dasharray:408;stroke-dashoffset:0;transition:stroke-dashoffset .1s linear,stroke .2s;}
.timer-num{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-display);font-size:2.6rem;font-weight:900;color:var(--accent);}

.rlist{list-style:none;display:flex;flex-direction:column;gap:.35rem;max-height:30vh;overflow-y:auto;}
.ritem{display:flex;align-items:center;gap:.6rem;background:var(--bg-elevated);border:1px solid rgba(255,255,255,.07);border-radius:var(--r-sm);padding:.45rem .65rem;font-family:var(--font-mono);font-size:.82rem;}
.ritem .seat{color:var(--accent);font-weight:700;}
.ritem .nm{flex:1;font-weight:700;}
.ritem .pts{color:var(--accent);font-weight:800;}
.ritem button{background:none;border:none;color:var(--text-muted);cursor:pointer;display:grid;place-items:center;}

.ico{display:inline-flex;width:17px;height:17px;flex-shrink:0;}
.ico svg{width:100%;height:100%;display:block;}
</style>
</head>
<body>
<header class="pd-hud">
  <button class="hud-exit" id="btnHub" type="button"><span class="ico" data-ic="home"></span><span>HUB</span></button>
  <div class="hud-mid">
    <span class="hud-badge" id="hudBadge">SETUP // PHASE</span>
    <span class="hud-label" id="hudLabel">5-Second Rule</span>
  </div>
  <div class="hud-count" id="hudCount">00:00</div>
</header>

<main>
  <!-- SETUP -->
  <section class="phase on" id="phSetup">
    <div class="hero"><span class="ico" data-ic="clock"></span></div>
    <h1 class="title">5-Second Rule</h1>
    <p class="sub">Name 3 things in a category before the ring runs out. Fail and it's a penalty.</p>
    <div class="panel">
      <p class="ptitle">Roster</p>
      <ul class="rlist" id="rList"></ul>
      <div style="display:flex;gap:.5rem;margin-top:.6rem;">
        <input type="text" id="rInput" placeholder="Add player..." maxlength="14" style="flex:1;background:var(--bg-elevated);border:1px solid rgba(255,255,255,.12);border-radius:var(--r-sm);color:#fff;font-family:var(--font-mono);padding:.5rem .7rem;outline:none;">
        <button class="btn" id="rAdd" style="width:54px;min-height:auto;">+</button>
      </div>
    </div>
    <button class="btn push" id="btnStart" type="button">Start Game</button>
  </section>

  <!-- PLAY -->
  <section class="phase" id="phPlay">
    <div class="panel" style="text-align:center;">
      <p class="ptitle" id="turnLabel">CURRENT PLAYER: —</p>
      <h1 class="title" id="turnName" style="color:var(--accent);">Player</h1>
    </div>
    <div class="prompt-banner">
      <span class="prompt-tag">NAME 3 THINGS</span>
      <div class="prompt-text" id="promptText">Tap Draw Topic</div>
    </div>
    <div class="timer-wrap">
      <div class="timer-ring">
        <svg><circle class="tr-bg" cx="75" cy="75" r="65"/><circle class="tr-fg" id="trFg" cx="75" cy="75" r="65"/></svg>
        <div class="timer-num" id="trNum">5</div>
      </div>
    </div>
    <div id="controlsIdle">
      <button class="btn" id="btnDraw" type="button">Draw Topic &amp; Start</button>
    </div>
    <div class="btn-row" id="controlsResult" style="display:none;">
      <button class="btn fail-btn" id="btnFail" type="button">Failed</button>
      <button class="btn success-btn" id="btnPass" type="button">Passed +1</button>
    </div>
  </section>

  <!-- RESULTS -->
  <section class="phase" id="phResult">
    <div class="hero"><span class="ico" data-ic="trophy"></span></div>
    <h1 class="title">Session Scoreboard</h1>
    <div class="panel">
      <ul class="rlist" id="finalScores" style="max-height:none;"></ul>
    </div>
    <div class="btn-row push">
      <button class="btn ghost" id="btnExit" type="button">Exit to Hub</button>
      <button class="btn" id="btnAgain" type="button">Keep Playing</button>
    </div>
  </section>
</main>

<script>
(function(){
"use strict";
const LOCAL={
 home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>',
 clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>',
 trophy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0Z"/><path d="M17 5h3a2 2 0 0 1-2 5M7 5H4a2 2 0 0 0 2 5"/></svg>',
 close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>'
};
function ICO(k){ return LOCAL[k]||''; }
document.querySelectorAll('[data-ic]').forEach(el=> el.innerHTML=ICO(el.getAttribute('data-ic')));

const PD={
 getPlayers:()=>{ try{ return JSON.parse(localStorage.getItem("partydeck_players")||"[]"); }catch(e){return[];} },
 setPlayers:(a)=>{ try{ localStorage.setItem("partydeck_players",JSON.stringify(a)); }catch(e){} },
 exitToHub:()=>{ window.location.href="../../index.html"; },
 vibrate:(p)=>{ if(navigator.vibrate)try{navigator.vibrate(p);}catch(e){} }
};
(function(){
 let t="cyber-neon";try{t=localStorage.getItem("partydeck_theme")||t;}catch(e){}
 document.documentElement.setAttribute("data-theme",t);
})();

const Sfx={
 ctx:null,
 ok(){ if(!this.ctx)try{this.ctx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){} if(this.ctx&&this.ctx.state==="suspended")this.ctx.resume(); return !!this.ctx; },
 t(f,d,type,vol,slide,delay){
  if(!this.ok())return; const c=this.ctx, t0=c.currentTime+(delay||0), o=c.createOscillator(), g=c.createGain();
  o.type=type||"square"; o.frequency.setValueAtTime(f,t0);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t0+d);
  g.gain.setValueAtTime(vol||.14,t0); g.gain.exponentialRampToValueAtTime(.0001,t0+d);
  o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0+d);
 },
 play(n){
  switch(n){
   case"click": this.t(880,.045,"square",.1); break;
   case"tick": this.t(700,.035,"square",.08); break;
   case"buzz": this.t(200,.35,"sawtooth",.2); break;
   case"success": this.t(523,.08,"triangle",.15); this.t(659,.08,"triangle",.15,null,.07); this.t(784,.14,"triangle",.15,null,.14); break;
  }
 }
};

const PROMPTS=[
 "Breeds of dogs","Pizza toppings","Things you find in space","Excuses to leave a party",
 "Superheroes","Types of pasta","Things in a dentist's office","Cartoon characters",
 "Things you shouldn't microwave","Countries in Europe","Things made of wood","Video games",
 "Things you do in the morning","Sports with a ball","Colors in a rainbow","Things found in a pocket",
 "Types of cheese","Movie monsters","Things that smell good","Reasons to be late",
 "Kitchen appliances","Things at a beach","Ice cream flavors","Board games",
 "Famous painters","Things with wheels","Bird species","Things that are sticky",
 "Halloween costumes","Fast food chains","Things in a toolbox","Card games",
 "Things you plug in","Musical instruments","Olympic sports","Types of shoes",
 "Things in a first-aid kit","Star Wars characters","Breakfast foods","Types of hats"
];

let roster=PD.getPlayers().slice(0,12);
if(roster.length<1) roster=["Player 1","Player 2","Player 3"];
const scores={}; roster.forEach(p=>scores[p]=0);

const S={pool:[...PROMPTS].sort(()=>Math.random()-.5),turnIdx:0,running:false,tickHandle:null,circumference:2*Math.PI*65};

const $=id=>document.getElementById(id);
function hud(b,l,c){ $('hudBadge').textContent=b; $('hudLabel').textContent=l; if(c)$('hudCount').textContent=c; }
function go(id){ document.querySelectorAll('.phase').forEach(p=>p.classList.remove('on')); $(id).classList.add('on'); window.scrollTo(0,0); }

function renderRoster(){
 $('rList').innerHTML=roster.map((p,i)=>`<li class="ritem"><span class="seat">#${i+1}</span><span class="nm">${p}</span><button type="button" data-del="${i}">${ICO('close')}</button></li>`).join('');
 PD.setPlayers(roster);
}
$('rAdd').onclick=()=>{ const v=$('rInput').value.trim(); if(v&&roster.indexOf(v)===-1){ roster.push(v); scores[v]=0; $('rInput').value=''; renderRoster(); Sfx.play('click'); } };
$('rList').onclick=e=>{ const b=e.target.closest('[data-del]'); if(b){ const nm=roster[+b.dataset.del]; delete scores[nm]; roster.splice(+b.dataset.del,1); renderRoster(); Sfx.play('click'); } };

$('btnStart').onclick=()=>{
 S.turnIdx=0;
 hud("PLAYING",roster[0],"00:05");
 renderTurn();
 go('phPlay');
 Sfx.play('success');
};

function renderTurn(){
 const who=roster[S.turnIdx % roster.length];
 $('turnLabel').textContent=`CURRENT PLAYER: ${who.toUpperCase()}`;
 $('turnName').textContent=who;
 $('promptText').textContent='Tap Draw Topic';
 resetRing();
 $('controlsIdle').style.display='block';
 $('controlsResult').style.display='none';
}

function resetRing(){
 $('trFg').style.strokeDashoffset=0;
 $('trFg').style.stroke='var(--accent)';
 $('trNum').textContent='5';
 $('trNum').style.color='var(--accent)';
}

$('btnDraw').onclick=()=>{
 if(S.pool.length===0) S.pool=[...PROMPTS].sort(()=>Math.random()-.5);
 $('promptText').textContent=S.pool.pop();
 $('controlsIdle').style.display='none';
 resetRing();
 S.running=true;
 const duration=5000, start=Date.now();
 function loop(){
  if(!S.running)return;
  const elapsed=Date.now()-start;
  const remain=Math.max(0,duration-elapsed);
  const progress=elapsed/duration;
  $('trFg').style.strokeDashoffset=(progress*S.circumference).toFixed(1);
  $('trNum').textContent=Math.ceil(remain/1000);
  if(remain<=2000){ $('trFg').style.stroke='var(--danger)'; $('trNum').style.color='var(--danger)'; }
  Sfx.play('tick');
  if(remain<=0){
   S.running=false;
   Sfx.play('buzz'); PD.vibrate([100,50,100]);
   $('controlsResult').style.display='flex';
  } else {
   S.tickHandle=setTimeout(loop,250);
  }
 }
 loop();
};

$('btnPass').onclick=()=>{
 const who=roster[S.turnIdx % roster.length];
 scores[who]=(scores[who]||0)+1;
 Sfx.play('success');
 advanceTurn();
};
$('btnFail').onclick=()=>{
 Sfx.play('buzz');
 advanceTurn();
};
function advanceTurn(){
 S.turnIdx++;
 hud("PLAYING",roster[S.turnIdx%roster.length]);
 renderTurn();
}

$('btnHub').onclick=()=>PD.exitToHub();
$('btnExit').onclick=()=>PD.exitToHub();

renderRoster();
})();
</script>
</body>
</html>

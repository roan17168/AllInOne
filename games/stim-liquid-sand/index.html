<!DOCTYPE html>
<html lang="en" data-theme="tokyo-sunset">
<head>
  
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#120e24" id="metaThemeColor" />
<title>Kinetic Neon Sand Matrix | PartyDeck</title>
<script>
(function(){try{var t=localStorage.getItem("partydeck_theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Space+Grotesk:wght@700;900&family=Space+Mono:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/themes.css" />
<link rel="stylesheet" href="../../css/base.css" />
<style>
  :root {
    --bg-primary: #120e24; --bg-surface: #1a1433; --bg-elevated: #261e47;
    --text-primary: #ffffff; --text-secondary: #d6b4fc; --text-muted: #8b62b8;
    --accent: #ff007f; --accent-glow: rgba(255,0,127,0.45); --accent-contrast: #ffffff;
    --danger: #ff0044; --success: #00ffaa; --warning: #ffd000;
    --border-ui: rgba(255,0,127,0.25); --r-sm: 8px; --r-md: 14px; --r-lg: 20px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    min-height: 100%; height: 100dvh; margin: 0; padding: 0; overflow: hidden;
    background: var(--bg-primary); color: var(--text-primary);
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    user-select: none; -webkit-user-select: none;
  }
  .gm-root {
    display: flex; flex-direction: column; min-height: 100%; height: 100dvh; width: 100%; overflow: hidden;
  }
  .gm-top {
    position: sticky; top: 0; z-index: 40; display: flex; align-items: center; justify-content: space-between;
    gap: .75rem; padding: .55rem .9rem; background: var(--bg-surface); border-bottom: 1px solid var(--border-ui);
    padding-top: max(.55rem, env(safe-area-inset-top)); flex-shrink: 0;
  }
  .gm-idblock { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
  .gm-title { font-family: 'Space Grotesk', sans-serif; font-size: 1rem; font-weight: 900; }
  .gm-sub { font-family: 'Space Mono', monospace; font-size: .62rem; color: var(--accent); letter-spacing: .12em; text-transform: uppercase; }
  .btn-icon-only {
    width: 40px; height: 40px; min-height: 40px; border-radius: var(--r-sm);
    background: var(--bg-elevated); border: 1px solid var(--border-ui);
    color: var(--text-primary); display: flex; align-items: center; justify-content: center;
    cursor: pointer; text-decoration: none;
  }

  .canvas-stage-wrap {
    flex: 1; width: 100%; height: 100%; position: relative; overflow: hidden; touch-action: none;
  }
  #sandCanvas {
    width: 100%; height: 100%; display: block; touch-action: none;
  }

  /* Control Dock */
  .sand-dock {
    display: flex; align-items: center; justify-content: space-between; gap: .5rem;
    padding: .5rem .8rem; background: var(--bg-surface); border-top: 1px solid var(--border-ui);
    padding-bottom: max(.6rem, calc(env(safe-area-inset-bottom) + .4rem)); flex-shrink: 0; z-index: 30;
  }
  .swatch-group { display: flex; gap: .35rem; }
  .swatch-btn {
    width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--border-ui);
    cursor: pointer; transition: transform .15s ease;
  }
  .swatch-btn.is-active { transform: scale(1.15); border-color: #fff; box-shadow: 0 0 10px currentColor; }
  .tool-btn {
    background: var(--bg-elevated); border: 1px solid var(--border-ui); color: var(--text-secondary);
    padding: .35rem .65rem; border-radius: var(--r-sm); font-family: 'Space Mono', monospace;
    font-size: .68rem; font-weight: 800; display: inline-flex; align-items: center; gap: 4px; cursor: pointer;
  }
  .tool-btn.is-active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tool-btn svg { width: 14px; height: 14px; }
</style>
</head>
<body>
<div class="gm-root">
  <header class="gm-top">
    <div class="gm-idblock">
      <span class="gm-title">Kinetic Neon Sand</span>
      <span class="gm-sub" id="modeSubtitle">Zen Matrix Sandbox</span>
    </div>
    <div class="gm-actions" style="display:flex;gap:.4rem;">
      <button type="button" class="btn-icon-only" id="btnReqTilt" title="Enable Tilt Sensors">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>
      </button>
      <a class="btn-icon-only" href="../../index.html" aria-label="Exit to Hub">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </a>
    </div>
  </header>

  <div class="canvas-stage-wrap" id="sandWrap">
    <canvas id="sandCanvas"></canvas>
  </div>

  <footer class="sand-dock">
    <div class="swatch-group" id="swatchGroup">
      <button type="button" class="swatch-btn is-active" data-col="1" style="background:#ff007f;color:#ff007f;"></button>
      <button type="button" class="swatch-btn" data-col="2" style="background:#00ffaa;color:#00ffaa;"></button>
      <button type="button" class="swatch-btn" data-col="3" style="background:#38bdf8;color:#38bdf8;"></button>
      <button type="button" class="swatch-btn" data-col="4" style="background:#ffd000;color:#ffd000;"></button>
    </div>
    <div style="display:flex;gap:.4rem;">
      <button type="button" class="tool-btn" id="btnBarrier">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Barrier
      </button>
      <button type="button" class="tool-btn" id="btnClearSand">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
        Clear
      </button>
    </div>
  </footer>
</div>

<script>
(function(){
"use strict";

const $ = id => document.getElementById(id);

/* ================= WEB AUDIO SYNTH ================= */
const AudioSand = {
  ctx: null,
  init(){
    if(!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
  },
  pourChime(colIdx){
    try {
      this.init();
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      const freqs = [523.25, 659.25, 783.99, 1046.50];
      osc.type = "sine";
      osc.frequency.setValueAtTime(freqs[(colIdx - 1) % freqs.length] || 440, now);
      gain.gain.setValueAtTime(0.04, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.06);
    }catch(e){}
  }
};

/* ================= CELLULAR AUTOMATA GRID ================= */
const cvs = $("sandCanvas");
const ctx = cvs.getContext("2d");
const wrap = $("sandWrap");

const COLS = 120;
const ROWS = 200;
let grid = new Uint8Array(COLS * ROWS); // 0: empty, 1-4: sand colors, 5: wall barrier

const COLOR_MAP = {
  0: null,
  1: "#ff007f",
  2: "#00ffaa",
  3: "#38bdf8",
  4: "#ffd000",
  5: "#8b62b8"
};

let activeColor = 1;
let barrierMode = false;
let gx = 0, gy = 1; // Gravity vectors
let pointers = new Map();

function resize(){
  const rect = wrap.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  cvs.width = Math.round(rect.width * dpr);
  cvs.height = Math.round(rect.height * dpr);
  cvs.style.width = rect.width + "px";
  cvs.style.height = rect.height + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function updatePhysics(){
  const dirX = gx > 0.3 ? 1 : (gx < -0.3 ? -1 : 0);

  for(let y = ROWS - 2; y >= 0; y--){
    for(let x = 0; x < COLS; x++){
      const idx = y * COLS + x;
      const val = grid[idx];

      if(val >= 1 && val <= 4){
        const below = (y + 1) * COLS + x;
        const belowLeft = (y + 1) * COLS + (x - 1);
        const belowRight = (y + 1) * COLS + (x + 1);

        if(grid[below] === 0){
          grid[below] = val;
          grid[idx] = 0;
        } else if(dirX === -1 && x > 0 && grid[belowLeft] === 0){
          grid[belowLeft] = val;
          grid[idx] = 0;
        } else if(dirX === 1 && x < COLS - 1 && grid[belowRight] === 0){
          grid[belowRight] = val;
          grid[idx] = 0;
        } else if(Math.random() < 0.5 && x > 0 && grid[belowLeft] === 0){
          grid[belowLeft] = val;
          grid[idx] = 0;
        } else if(x < COLS - 1 && grid[belowRight] === 0){
          grid[belowRight] = val;
          grid[idx] = 0;
        }
      }
    }
  }
}

function render(){
  const rect = wrap.getBoundingClientRect();
  const cellW = rect.width / COLS;
  const cellH = rect.height / ROWS;

  ctx.fillStyle = "#120e24";
  ctx.fillRect(0, 0, rect.width, rect.height);

  for(let y = 0; y < ROWS; y++){
    for(let x = 0; x < COLS; x++){
      const val = grid[y * COLS + x];
      if(val !== 0){
        ctx.fillStyle = COLOR_MAP[val];
        ctx.fillRect(x * cellW, y * cellH, cellW + 0.5, cellH + 0.5);
      }
    }
  }

  // Handle active touch sand streaming
  pointers.forEach(p => {
    const gxPos = Math.floor((p.x / rect.width) * COLS);
    const gyPos = Math.floor((p.y / rect.height) * ROWS);

    for(let dy = -2; dy <= 2; dy++){
      for(let dx = -2; dx <= 2; dx++){
        const nx = gxPos + dx;
        const ny = gyPos + dy;
        if(nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS){
          grid[ny * COLS + nx] = barrierMode ? 5 : activeColor;
        }
      }
    }
    if(!barrierMode && Math.random() < 0.25) AudioSand.pourChime(activeColor);
  });

  updatePhysics();
  requestAnimationFrame(render);
}

/* ================= ACCELEROMETER / GYROSCOPE ================= */
function handleOrientation(e){
  if(e.gamma !== null && e.beta !== null){
    gx = Math.max(-1, Math.min(1, e.gamma / 35));
    gy = Math.max(0.2, Math.min(1, e.beta / 45));
  }
}

$("btnReqTilt").onclick = async () => {
  if(typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function"){
    try {
      const res = await DeviceOrientationEvent.requestPermission();
      if(res === "granted"){
        window.addEventListener("deviceorientation", handleOrientation);
        $("modeSubtitle").textContent = "Gyro Tilt Active";
      }
    }catch(e){}
  } else {
    window.addEventListener("deviceorientation", handleOrientation);
    $("modeSubtitle").textContent = "Gyro Tilt Active";
  }
};

/* ================= CONTROLS ================= */
$("swatchGroup").onclick = e => {
  const b = e.target.closest("[data-col]");
  if(!b) return;
  document.querySelectorAll("#swatchGroup .swatch-btn").forEach(x => x.classList.remove("is-active"));
  b.classList.add("is-active");
  activeColor = parseInt(b.dataset.col, 10);
  barrierMode = false;
  $("btnBarrier").classList.remove("is-active");
};

$("btnBarrier").onclick = () => {
  barrierMode = !barrierMode;
  $("btnBarrier").classList.toggle("is-active", barrierMode);
};

$("btnClearSand").onclick = () => {
  grid.fill(0);
};

cvs.addEventListener("pointerdown", e => {
  e.preventDefault();
  const rect = cvs.getBoundingClientRect();
  pointers.set(e.pointerId, { x: e.clientX - rect.left, y: e.clientY - rect.top });
});

cvs.addEventListener("pointermove", e => {
  if(pointers.has(e.pointerId)){
    const rect = cvs.getBoundingClientRect();
    pointers.set(e.pointerId, { x: e.clientX - rect.left, y: e.clientY - rect.top });
  }
});

const endPointer = e => { pointers.delete(e.pointerId); };
cvs.addEventListener("pointerup", endPointer);
cvs.addEventListener("pointercancel", endPointer);

window.addEventListener("resize", resize);
window.addEventListener("orientationchange", () => setTimeout(resize, 200));

resize();
requestAnimationFrame(render);

})();
</script>
</body>
</html>

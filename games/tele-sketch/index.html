<!DOCTYPE html>
<html lang="en" data-theme="nordic-slate">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0e1117" id="metaThemeColor" />
<title>Tele-Sketch | PartyDeck</title>
<script>
(function(){try{var t=localStorage.getItem("partydeck_theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Space+Grotesk:wght@700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/themes.css" />
<link rel="stylesheet" href="../../css/base.css" />
<style>
  :root {
    --bg-primary: #0e1117; --bg-surface: #161b24; --bg-elevated: #1f2633;
    --text-primary: #f0f4f8; --text-secondary: #94a3b8; --text-muted: #627288;
    --accent: #38bdf8; --accent-glow: rgba(56,189,248,0.35); --accent-contrast: #031525;
    --danger: #ff0055; --success: #00ffaa; --warning: #ffd000;
    --border-ui: rgba(148,163,184,0.16); --r-sm: 8px; --r-md: 14px; --r-lg: 20px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg-primary); color: var(--text-primary);
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    min-height: 100%; height: 100dvh; display: flex; flex-direction: column;
    overflow: hidden; user-select: none; -webkit-user-select: none;
  }
  .gm-top {
    position: sticky; top: 0; z-index: 40; display: flex; align-items: center; justify-content: space-between;
    gap: .75rem; padding: .55rem .9rem; background: var(--bg-surface); border-bottom: 1px solid var(--border-ui);
    padding-top: max(.55rem, env(safe-area-inset-top)); flex-shrink: 0;
  }
  .gm-idblock { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
  .gm-title { font-family: 'Space Grotesk', sans-serif; font-size: 1rem; font-weight: 900; }
  .gm-sub { font-family: 'Space Mono', monospace; font-size: .62rem; color: var(--accent); letter-spacing: .12em; text-transform: uppercase; }
  .btn-icon-only {
    width: 40px; height: 40px; min-height: 40px; border-radius: var(--r-sm);
    background: var(--bg-elevated); border: 1px solid var(--border-ui);
    color: var(--text-primary); display: flex; align-items: center; justify-content: center;
    cursor: pointer; text-decoration: none;
  }
  .stage { flex: 1; display: flex; flex-direction: column; position: relative; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .screen {
    display: none; flex-direction: column; gap: 1rem; padding: 1.1rem;
    max-width: 600px; margin: 0 auto; width: 100%; min-height: 100%;
    padding-bottom: max(1.5rem, calc(env(safe-area-inset-bottom) + 1.2rem));
  }
  .screen.is-active { display: flex; }
  .panel { background: var(--bg-surface); border: 1px solid var(--border-ui); border-radius: var(--r-md); padding: 1.1rem; }
  .panel-title { font-family: 'Space Mono', monospace; font-size: .65rem; color: var(--text-muted); letter-spacing: .14em; text-transform: uppercase; margin-bottom: .6rem; }

  /* Canvas Stage */
  .canvas-wrap {
    width: 100%; aspect-ratio: 1; background: #fafaf7; border-radius: var(--r-md);
    border: 2px solid var(--border-ui); overflow: hidden; position: relative; touch-action: none;
  }
  #sketchCanvas, #replayCanvas { width: 100%; height: 100%; display: block; touch-action: none; }

  /* Toolbar */
  .tool-strip { display: flex; gap: .4rem; align-items: center; justify-content: space-between; margin-top: .4rem; }
  .swatch-box { display: flex; gap: .35rem; overflow-x: auto; scrollbar-width: none; }
  .swatch-box::-webkit-scrollbar { display: none; }
  .swatch {
    width: 32px; height: 32px; border-radius: 50%; border: 2px solid #fff; cursor: pointer; flex-shrink: 0;
    transition: transform 0.15s ease;
  }
  .swatch.is-active { transform: scale(1.18); border-color: var(--accent); box-shadow: 0 0 10px var(--accent-glow); }

  .btn {
    width: 100%; min-height: 52px; display: flex; align-items: center; justify-content: center; gap: 8px;
    background: var(--accent); color: var(--accent-contrast); border: none; border-radius: var(--r-sm);
    font-family: 'Space Mono', monospace; font-size: .88rem; font-weight: 800; text-transform: uppercase;
    box-shadow: 0 0 16px var(--accent-glow); cursor: pointer; text-decoration: none;
  }
  .btn:active { transform: scale(.98); }
  .btn.ghost { background: transparent; color: var(--text-secondary); border: 1px solid var(--border-ui); box-shadow: none; }
</style>
</head>
<body>
<header class="gm-top">
  <div class="gm-idblock">
    <span class="gm-title">Tele-Sketch</span>
    <span class="gm-sub" id="topSub">Pass &amp; Draw or Solo</span>
  </div>
  <div class="gm-actions">
    <a class="btn-icon-only" href="../../index.html" aria-label="Exit to Hub">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    </a>
  </div>
</header>

<div class="stage">
  <!-- SETUP -->
  <section class="screen is-active" id="scrSetup">
    <div class="panel">
      <div class="panel-title">Game Mode</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:.5rem;">
        <button type="button" class="btn ghost is-active" id="btnModeSolo" style="min-height:44px;font-size:.78rem;">Solo Sketch (1P)</button>
        <button type="button" class="btn ghost" id="btnModePass" style="min-height:44px;font-size:.78rem;">Pass &amp; Guess (2-12P)</button>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">Active Roster (<span id="rosterCountDisplay">1</span>)</div>
      <ul id="rosterList" style="list-style:none;display:flex;flex-direction:column;gap:.4rem;max-height:20vh;overflow-y:auto;font-family:monospace;font-size:.85rem;"></ul>
      <div style="display:flex;gap:.4rem;margin-top:.6rem;">
        <input type="text" id="inputNewPlayer" placeholder="Add player name..." maxlength="15" style="flex:1;background:#090c12;border:1px solid #334155;border-radius:6px;color:#fff;padding:8px;font-size:14px;outline:none;" />
        <button type="button" id="btnAddPlayer" style="background:var(--accent);color:var(--accent-contrast);border:none;border-radius:6px;padding:0 14px;font-weight:bold;cursor:pointer;">+</button>
      </div>
    </div>

    <button type="button" class="btn" id="btnStartGame" style="margin-top:auto;">Start Drawing</button>
  </section>

  <!-- DRAW -->
  <section class="screen" id="scrDraw">
    <div style="background:var(--bg-surface);border:1px solid var(--border-ui);border-radius:var(--r-sm);padding:.6rem 1rem;display:flex;justify-content:space-between;align-items:center;">
      <div>
        <div style="font-family:'Space Mono',monospace;font-size:.6rem;color:var(--text-muted);text-transform:uppercase;">Secret Prompt</div>
        <strong style="color:var(--accent);font-size:1.1rem;" id="drawPromptText">Prompt</strong>
      </div>
      <button type="button" id="btnRerollPrompt" style="background:#1e293b;color:#cbd5e1;border:none;padding:6px 10px;border-radius:6px;font-family:monospace;font-size:11px;cursor:pointer;">🎲 Re-Roll</button>
    </div>

    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="sketchCanvas"></canvas>
    </div>

    <div class="tool-strip">
      <div class="swatch-box" id="swatchBox"></div>
      <button type="button" id="btnClearCanvas" style="background:#1e293b;border:1px solid var(--border-ui);color:#fff;padding:6px 12px;border-radius:6px;font-family:monospace;font-size:11px;cursor:pointer;">Clear</button>
    </div>

    <button type="button" class="btn" id="btnDoneDrawing" style="margin-top:auto;">Done Sketching</button>
  </section>

  <!-- REPLAY / FINALE -->
  <section class="screen" id="scrReplay">
    <div class="panel" style="text-align:center;">
      <div class="panel-title">Gallery Replay</div>
      <h3 style="font-family:'Space Grotesk',sans-serif;font-size:1.4rem;font-weight:900;color:var(--accent);" id="replayTitle">Drawing Completed!</h3>
    </div>

    <div class="canvas-wrap">
      <canvas id="replayCanvas"></canvas>
    </div>

    <button type="button" class="btn" id="btnNewDrawing" style="margin-top:auto;">Draw Another Prompt</button>
  </section>
</div>

<script>
(function(){
  "use strict";
  const $ = id => document.getElementById(id);

  const PROMPTS = [
    "Dancing T-Rex in high heels", "Robot spilling hot coffee", "Cat driving a submarine",
    "Astronaut eating pizza in orbit", "Sneaky raccoon stealing wifi", "Penguin DJ at a rave",
    "Cactus giving a warm hug", "Flamingo playing bowling", "Ninja delivering birthday cake",
    "UFO abducting an ice cream truck", "Cyberpunk duck with goggles", "Squirrel banking acorns"
  ];

  const INKS = ["#1a1a1a", "#e03131", "#f76707", "#e8a70b", "#2f9e44", "#1971c2", "#7048e8", "#e64980"];
  let activeInk = INKS[0];

  let roster = ["Player 1"];
  try {
    const raw = localStorage.getItem("partydeck_players");
    if (raw) {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed) && parsed.length > 0) roster = parsed.map(p => typeof p === "string" ? p : p.name);
    }
  } catch(e){}

  let currentPrompt = "";
  let strokes = []; // normalized { points: [{x, y}], color: string }
  let currentStroke = null;

  const cvs = $("sketchCanvas");
  const ctx = cvs.getContext("2d");
  const replayCvs = $("replayCanvas");
  const replayCtx = replayCvs.getContext("2d");

  function showScreen(id) {
    document.querySelectorAll(".screen").forEach(s => s.classList.toggle("is-active", s.id === id));
  }

  function resizeCanvas(targetCvs, targetCtx) {
    const rect = targetCvs.parentElement.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    targetCvs.width = Math.round(rect.width * dpr);
    targetCvs.height = Math.round(rect.height * dpr);
    targetCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function renderRoster() {
    $("rosterCountDisplay").textContent = roster.length;
    $("rosterList").innerHTML = roster.map((p, i) => `
      <li style="display:flex;justify-content:space-between;background:#1a2230;padding:6px 10px;border-radius:6px;border:1px solid #334155;">
        <span>#${i+1} ${p}</span>
        ${roster.length > 1 ? `<button type="button" data-del="${i}" style="background:none;border:none;color:#ff557f;cursor:pointer;">&times;</button>` : ''}
      </li>
    `).join("");
  }

  $("btnAddPlayer").onclick = () => {
    const name = $("inputNewPlayer").value.trim();
    if (name && !roster.includes(name)) {
      roster.push(name);
      $("inputNewPlayer").value = "";
      renderRoster();
    }
  };

  $("rosterList").onclick = e => {
    if (e.target.dataset.del) {
      roster.splice(parseInt(e.target.dataset.del, 10), 1);
      renderRoster();
    }
  };

  // Swatches
  const swatchBox = $("swatchBox");
  INKS.forEach(col => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = `swatch ${col === activeInk ? 'is-active' : ''}`;
    btn.style.backgroundColor = col;
    btn.onclick = () => {
      activeInk = col;
      document.querySelectorAll(".swatch").forEach(s => s.classList.toggle("is-active", s === btn));
    };
    swatchBox.appendChild(btn);
  });

  // Canvas Drawing Engine
  function getPos(e) {
    const rect = cvs.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {
      x: (clientX - rect.left) / rect.width,
      y: (clientY - rect.top) / rect.height
    };
  }

  function redrawAll(targetCvs, targetCtx, strokeList) {
    const w = targetCvs.parentElement.clientWidth;
    const h = targetCvs.parentElement.clientHeight;
    targetCtx.fillStyle = "#fafaf7";
    targetCtx.fillRect(0, 0, w, h);

    strokeList.forEach(st => {
      if (st.points.length < 2) return;
      targetCtx.strokeStyle = st.color;
      targetCtx.lineWidth = 4;
      targetCtx.lineCap = "round";
      targetCtx.lineJoin = "round";
      targetCtx.beginPath();
      targetCtx.moveTo(st.points[0].x * w, st.points[0].y * h);
      for (let i = 1; i < st.points.length; i++) {
        targetCtx.lineTo(st.points[i].x * w, st.points[i].y * h);
      }
      targetCtx.stroke();
    });
  }

  cvs.addEventListener("pointerdown", e => {
    e.preventDefault();
    const p = getPos(e);
    currentStroke = { color: activeInk, points: [p] };
    strokes.push(currentStroke);
  });

  cvs.addEventListener("pointermove", e => {
    if (!currentStroke) return;
    e.preventDefault();
    currentStroke.points.push(getPos(e));
    redrawAll(cvs, ctx, strokes);
  });

  const stopDrawing = () => { currentStroke = null; };
  cvs.addEventListener("pointerup", stopDrawing);
  cvs.addEventListener("pointercancel", stopDrawing);

  $("btnClearCanvas").onclick = () => {
    strokes = [];
    redrawAll(cvs, ctx, strokes);
  };

  $("btnRerollPrompt").onclick = () => {
    currentPrompt = PROMPTS[Math.floor(Math.random() * PROMPTS.length)];
    $("drawPromptText").textContent = currentPrompt;
  };

  $("btnStartGame").onclick = () => {
    currentPrompt = PROMPTS[Math.floor(Math.random() * PROMPTS.length)];
    $("drawPromptText").textContent = currentPrompt;
    strokes = [];
    showScreen("scrDraw");
    setTimeout(() => {
      resizeCanvas(cvs, ctx);
      redrawAll(cvs, ctx, strokes);
    }, 50);
  };

  $("btnDoneDrawing").onclick = () => {
    showScreen("scrReplay");
    $("replayTitle").textContent = `"${currentPrompt}"`;
    setTimeout(() => {
      resizeCanvas(replayCvs, replayCtx);
      redrawAll(replayCvs, replayCtx, strokes);
    }, 50);
  };

  $("btnNewDrawing").onclick = () => {
    $("btnStartGame").click();
  };

  renderRoster();
})();
</script>
</body>
</html>

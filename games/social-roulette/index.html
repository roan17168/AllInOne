<!DOCTYPE html>
<html lang="en" data-theme="cyber-neon">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#08090c" id="metaThemeColor" />
<title>Social Roulette | PartyDeck</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Space+Grotesk:wght@700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ================= ARCADE DESIGN SYSTEM ================= */
:root {
  --font-body: 'Plus Jakarta Sans', system-ui, sans-serif;
  --font-display: 'Space Grotesk', system-ui, sans-serif;
  --font-mono: 'Space Mono', monospace;
  --r-sm: 8px; --r-md: 14px; --r-lg: 20px;
  --ease: cubic-bezier(.2,.8,.3,1);
}
[data-theme="cyber-neon"] {
  --bg-primary: #08090c; --bg-surface: #10141b; --bg-elevated: #181e29;
  --text-primary: #ffffff; --text-secondary: #9ba3b4; --text-muted: #5c6577;
  --accent: #00ffcc; --accent-glow: rgba(0,255,204,0.35); --accent-secondary: #ff007f;
  --danger: #ff0055; --success: #00ff66; --border-color: rgba(0,255,204,0.22);
  --card-shadow: 0 12px 32px rgba(0,0,0,0.8), 0 0 15px rgba(0,255,204,0.12);
}
[data-theme="sunset-rave"] {
  --bg-primary: #0f071d; --bg-surface: #1e0f38; --bg-elevated: #321659;
  --text-primary: #ffffff; --text-secondary: #d6b4fc; --text-muted: #8b62b8;
  --accent: #ff007f; --accent-glow: rgba(255,0,127,0.45); --accent-secondary: #ff8800;
  --danger: #ff0044; --success: #00ffaa; --border-color: rgba(255,0,127,0.3);
  --card-shadow: 0 12px 32px rgba(0,0,0,0.8), 0 0 15px rgba(255,0,127,0.2);
}
[data-theme="retro-arcade"] {
  --bg-primary: #12131c; --bg-surface: #1a1b28; --bg-elevated: #26273b;
  --text-primary: #f5f5f5; --text-secondary: #a2a8d3; --text-muted: #6873a8;
  --accent: #ffd400; --accent-glow: rgba(255,212,0,0.35); --accent-secondary: #ff3860;
  --danger: #ff3860; --success: #42e2b8; --border-color: rgba(255,212,0,0.25);
  --card-shadow: 0 12px 32px rgba(0,0,0,0.8), 0 0 15px rgba(255,212,0,0.15);
}
[data-theme="minimal-light"] {
  --bg-primary: #f4f6f9; --bg-surface: #ffffff; --bg-elevated: #e8ecf2;
  --text-primary: #101828; --text-secondary: #475467; --text-muted: #98a2b3;
  --accent: #2563eb; --accent-glow: rgba(37,99,235,0.2); --accent-secondary: #7c3aed;
  --danger: #d92d20; --success: #0f9d58; --border-color: rgba(16,24,40,0.15);
  --card-shadow: 0 8px 24px rgba(16,24,40,0.08);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg-primary);color:var(--text-primary);font-family:var(--font-body);overflow-x:hidden;-webkit-user-select:none;user-select:none;}

.pd-hud {
  position:sticky;top:0;z-index:40;background:var(--bg-surface);border-bottom:2px solid var(--border-color);
  padding:.55rem .85rem;padding-top:max(.55rem,env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;gap:.5rem;
}
.hud-exit {
  display:flex;align-items:center;gap:6px;background:var(--bg-elevated);color:var(--text-secondary);
  border:1px solid var(--border-color);border-radius:var(--r-sm);font-family:var(--font-mono);font-size:.7rem;font-weight:700;
  padding:.42rem .65rem;cursor:pointer;text-decoration:none;
}
.hud-mid{display:flex;flex-direction:column;align-items:center;min-width:0;}
.hud-badge{font-family:var(--font-mono);font-size:.56rem;font-weight:800;letter-spacing:.14em;color:var(--accent);white-space:nowrap;text-transform:uppercase;}
.hud-label{font-family:var(--font-display);font-size:.95rem;font-weight:800;max-width:44vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hud-count{font-family:var(--font-mono);font-size:.92rem;font-weight:700;color:var(--accent);background:var(--bg-elevated);border:1px solid var(--border-color);border-radius:var(--r-sm);padding:.28rem .55rem;min-width:62px;text-align:center;}

main{flex:1;max-width:640px;margin:0 auto;padding:1rem;padding-bottom:max(1.2rem,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:.9rem;}
.phase{display:none;flex-direction:column;gap:.9rem;flex:1;}
.phase.on{display:flex;animation:pFade .2s var(--ease);}
@keyframes pFade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.hero{display:flex;justify-content:center;color:var(--accent);margin-top:.2rem;}
.hero .ico{width:44px;height:44px;filter:drop-shadow(0 0 12px var(--accent-glow));}
h1.title{font-family:var(--font-display);font-size:1.55rem;font-weight:900;letter-spacing:-.02em;text-align:center;}
p.sub{text-align:center;font-size:.86rem;color:var(--text-secondary);max-width:46ch;margin:0 auto;line-height:1.45;}
.panel{background:var(--bg-surface);border:1px solid var(--border-color);border-radius:var(--r-md);padding:.9rem;box-shadow:var(--card-shadow);}
.ptitle{font-family:var(--font-mono);font-size:.64rem;text-transform:uppercase;letter-spacing:.14em;color:var(--text-muted);margin-bottom:.55rem;}

.chips{display:flex;flex-wrap:wrap;gap:.45rem;}
.chip{background:var(--bg-elevated);color:var(--text-secondary);border:1px solid rgba(255,255,255,.1);border-radius:var(--r-sm);font-family:var(--font-mono);font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:.5rem .75rem;min-height:38px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.chip.is-on{background:var(--accent);color:var(--bg-primary);border-color:var(--accent);box-shadow:0 0 12px var(--accent-glow);}

.btn{width:100%;min-height:50px;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:var(--bg-primary);border:none;border-radius:var(--r-sm);font-family:var(--font-mono);font-size:.88rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;box-shadow:0 0 16px var(--accent-glow);cursor:pointer;}
.btn:active{transform:scale(.98);}
.btn.ghost{background:transparent;color:var(--text-secondary);border:1px solid rgba(255,255,255,.16);box-shadow:none;}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger);box-shadow:none;}
.btn-row{display:flex;gap:.6rem;}.btn-row>*{flex:1;}

/* Roulette Wheel */
.wheel-stage{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:.4rem 0;}
.wheel-pointer{position:absolute;top:-4px;z-index:10;color:var(--accent);filter:drop-shadow(0 0 8px var(--accent-glow));}
.wheel-svg{width:min(260px,72vw);aspect-ratio:1;border-radius:50%;border:2px solid var(--border-color);box-shadow:0 0 20px var(--accent-glow);transition:transform 4s cubic-bezier(.12,.72,.08,1);}
.wheel-hub{position:absolute;width:66px;height:66px;border-radius:50%;background:var(--bg-surface);border:2px solid var(--border-color);display:grid;place-items:center;font-family:var(--font-mono);font-size:.65rem;font-weight:800;letter-spacing:.1em;color:var(--accent);text-transform:uppercase;cursor:pointer;}

/* Prompt Card */
.prompt-card{min-height:140px;display:flex;flex-direction:column;justify-content:center;padding:1.2rem;border-radius:var(--r-md);background:var(--bg-elevated);border:1px solid var(--border-color);text-align:center;gap:.6rem;}
.p-cat{font-family:var(--font-mono);font-size:.65rem;letter-spacing:.16em;color:var(--accent);text-transform:uppercase;}
.p-txt{font-family:var(--font-display);font-size:1.2rem;font-weight:700;line-height:1.4;}
.p-txt em{font-style:normal;color:var(--accent-secondary);text-shadow:0 0 10px rgba(255,0,127,0.3);}

.rlist{list-style:none;display:flex;flex-direction:column;gap:.35rem;}
.ritem{display:flex;align-items:center;gap:.6rem;background:var(--bg-elevated);border:1px solid rgba(255,255,255,.07);border-radius:var(--r-sm);padding:.45rem .65rem;font-family:var(--font-mono);font-size:.82rem;}
.ritem .seat{color:var(--accent);font-weight:700;}
.ritem .nm{flex:1;font-weight:700;}
.ritem button{background:none;border:none;color:var(--text-muted);cursor:pointer;display:grid;place-items:center;}

.ico{display:inline-flex;width:17px;height:17px;flex-shrink:0;}
.ico svg{width:100%;height:100%;display:block;}
</style>
</head>
<body>
<header class="pd-hud">
  <button class="hud-exit" id="btnHub" type="button"><span class="ico" data-ic="home"></span><span>HUB</span></button>
  <div class="hud-mid">
    <span class="hud-badge" id="hudBadge">SETUP // PHASE</span>
    <span class="hud-label" id="hudLabel">Roster</span>
  </div>
  <div class="hud-count" id="hudCount">000 SPINS</div>
</header>

<main>
  <!-- PHASE 1: SETUP -->
  <section class="phase on" id="phSetup">
    <div class="hero"><span class="ico" data-ic="flame"></span></div>
    <h1 class="title">Social Roulette</h1>
    <p class="sub">Dynamic prompt generator that injects player names into wild dares, group votes, and hot questions.</p>
    <div class="panel">
      <p class="ptitle">Party Roster</p>
      <ul class="rlist" id="rList"></ul>
      <div style="display:flex;gap:.5rem;margin-top:.7rem;">
        <input type="text" id="rInput" placeholder="Add player name..." maxlength="14" style="flex:1;background:var(--bg-elevated);border:1px solid rgba(255,255,255,.12);border-radius:var(--r-sm);color:#fff;font-family:var(--font-mono);padding:.5rem .7rem;outline:none;">
        <button class="btn" id="rAdd" style="width:54px;min-height:auto;">+</button>
      </div>
    </div>
    <div class="panel">
      <p class="ptitle">Packs &middot; Tap to toggle</p>
      <div class="chips" id="packChips"></div>
    </div>
    <button class="btn push" id="btnStart" type="button">Load Roulette Wheel</button>
  </section>

  <!-- PHASE 2: PLAY -->
  <section class="phase" id="phPlay">
    <div class="wheel-stage">
      <div class="wheel-pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 22 4 4h16z"/></svg></div>
      <svg class="wheel-svg" id="wheelSvg" viewBox="0 0 200 200"></svg>
      <div class="wheel-hub" id="wheelHub">SPIN</div>
    </div>

    <div class="prompt-card">
      <div class="p-cat" id="promptCat">READY TO SPIN</div>
      <div class="p-txt" id="promptTxt">Tap the wheel or button below to deal the first prompt.</div>
    </div>

    <div class="btn-row">
      <button class="btn" id="btnDid" type="button">Did It +1</button>
      <button class="btn danger" id="btnPassed" type="button">Passed (Drink)</button>
    </div>
    <button class="btn ghost push" id="btnSpin" type="button">Spin the Wheel</button>
  </section>
</main>

<script>
(function(){
"use strict";
const LOCAL={
 home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>',
 flame:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0"/></svg>',
 close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>'
};
function ICO(k){ return LOCAL[k]||''; }
document.querySelectorAll('[data-ic]').forEach(el=> el.innerHTML=ICO(el.getAttribute('data-ic')));

const SDK=window.PartyDeck||{};
const PD={
 getPlayers:()=> { try{ return JSON.parse(localStorage.getItem("partydeck_players")||"[]"); }catch(e){return[];} },
 setPlayers:(a)=> { try{ localStorage.setItem("partydeck_players",JSON.stringify(a)); }catch(e){} },
 exitToHub:()=> { window.location.href="../../index.html"; },
 vibrate:(p)=> { if(navigator.vibrate)try{navigator.vibrate(p);}catch(e){} }
};
(function(){
 let t="cyber-neon";try{t=localStorage.getItem("partydeck_theme")||t;}catch(e){}
 document.documentElement.setAttribute("data-theme",t);
})();

const Sfx={
 ctx:null,
 ok(){ if(!this.ctx)try{this.ctx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){} if(this.ctx&&this.ctx.state==="suspended")this.ctx.resume(); return !!this.ctx; },
 t(f,d,type,vol,slide,delay){
  if(!this.ok())return; const c=this.ctx, t0=c.currentTime+(delay||0), o=c.createOscillator(), g=c.createGain();
  o.type=type||"square"; o.frequency.setValueAtTime(f,t0);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t0+d);
  g.gain.setValueAtTime(vol||.14,t0); g.gain.exponentialRampToValueAtTime(.0001,t0+d);
  o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0+d);
 },
 play(n){
  switch(n){
   case"click": this.t(900,.03,"square",.08); break;
   case"success": this.t(523,.08,"triangle",.15); this.t(659,.08,"triangle",.15,null,.07); this.t(784,.14,"triangle",.15,null,.14); break;
   case"alert": this.t(200,.25,"sawtooth",.18); break;
  }
 }
};

const PACKS=[
 {id:'ice', name:'Icebreaker', col:'#00ffcc', p:[
  "{A}, what is the most useless skill you possess?",
  "{A}, what's your most controversial food opinion?",
  "{A}, what did you want to be when you were 7?",
  "{A}, tell {B} the best compliment you could give them right now.",
  "{A}, what's the longest you've ever gone without sleep?"
 ]},
 {id:'party', name:'Party Chaos', col:'#ff007f', p:[
  "{A} and {B}: thumb war immediately. Loser drinks 2 units.",
  "{A}, do your best impression of {B}. Group votes if it passes.",
  "Everyone point at {A}. If you'd trust them with your unlocked phone, stay pointing.",
  "{A}, arm wrestle {B} or both take a penalty sip.",
  "Last person to touch the nearest door drinks. {A} counts down 3-2-1."
 ]},
 {id:'deep', name:'Deep Cut', col:'#ffd400', p:[
  "{A}, who in this room would you call at 3 AM in a real emergency?",
  "{A}, what's something you changed your mind about this past year?",
  "{A}, what's a text you wrote but never had the courage to send?",
  "{A}, tell {B} one trait of theirs you wish you had."
 ]},
 {id:'dare', name:'Physical Dare', col:'#00ff66', p:[
  "{A}, do 10 pushups right now or take 2 drinks.",
  "{A}, let {B} style your hair with their hands for the rest of the game.",
  "{A}, speak only in questions until your next spin.",
  "{A}, balance a cup on your head for 60 seconds."
 ]}
];

let roster=PD.getPlayers().slice(0,12);
if(roster.length<2) roster=["Alex","Sam","Taylor"];
const S={activePacks:['ice','party','deep','dare'],spins:0,rot:0,busy:false};

const $=id=>document.getElementById(id);
function hud(b,l,c){ $('hudBadge').textContent=b; $('hudLabel').textContent=l; if(c)$('hudCount').textContent=c; }
function go(id){ document.querySelectorAll('.phase').forEach(p=>p.classList.remove('on')); $(id).classList.add('on'); window.scrollTo(0,0); }

function renderRoster(){
 $('rList').innerHTML=roster.map((p,i)=>`<li class="ritem"><span class="seat">#${String(i+1).padStart(2,'0')}</span><span class="nm">${p}</span><button type="button" data-del="${i}">${ICO('close')}</button></li>`).join('');
 $('btnStart').disabled=roster.length<2;
 PD.setPlayers(roster);
}
$('rAdd').onclick=()=>{ const v=$('rInput').value.trim(); if(v&&roster.indexOf(v)===-1){ roster.push(v); $('rInput').value=''; Sfx.play('click'); renderRoster(); } };
$('rList').onclick=e=>{ const b=e.target.closest('[data-del]'); if(b){ roster.splice(+b.dataset.del,1); Sfx.play('click'); renderRoster(); } };

function renderPacks(){
 $('packChips').innerHTML=PACKS.map(p=>`<button class="chip${S.activePacks.includes(p.id)?' is-on':''}" type="button" data-pack="${p.id}">${p.name}</button>`).join('');
}
$('packChips').onclick=e=>{
 const b=e.target.closest('[data-pack]');
 if(b){
  const id=b.dataset.pack;
  if(S.activePacks.includes(id)){
   if(S.activePacks.length>1) S.activePacks=S.activePacks.filter(x=>x!==id);
  } else { S.activePacks.push(id); }
  renderPacks(); Sfx.play('click');
 }
};

$('btnStart').onclick=()=>{
 buildWheel();
 hud("SOCIAL ROULETTE","Live Deck","000 SPINS");
 go('phPlay');
 Sfx.play('success');
};

function buildWheel(){
 const live=PACKS.filter(p=>S.activePacks.includes(p.id));
 const n=live.length, deg=360/n, svg=$('wheelSvg');
 let h='';
 live.forEach((p,i)=>{
  const a0=(i*deg-90)*Math.PI/180, a1=((i+1)*deg-90)*Math.PI/180;
  const x0=100+94*Math.cos(a0), y0=100+94*Math.sin(a0);
  const x1=100+94*Math.cos(a1), y1=100+94*Math.sin(a1);
  const lg=deg>180?1:0;
  h+=`<path d="M100 100 L${x0.toFixed(1)} ${y0.toFixed(1)} A94 94 0 ${lg} 1 ${x1.toFixed(1)} ${y1.toFixed(1)} Z" fill="${p.col}" opacity=".88" stroke="#08090c" stroke-width="2"/>`;
 });
 svg.innerHTML=h;
}

function spinWheel(){
 if(S.busy)return;
 S.busy=true; S.spins++;
 const live=PACKS.filter(p=>S.activePacks.includes(p.id));
 const n=live.length, deg=360/n, targetIdx=Math.floor(Math.random()*n);
 const dest=S.rot + 1440 + (360 - (targetIdx*deg + deg/2) - (S.rot%360));
 S.rot=dest;
 $('wheelSvg').style.transform=`rotate(${dest}deg)`;
 
 let ticks=0;
 const tickTimer=setInterval(()=>{ Sfx.play('click'); if(++ticks>24) clearInterval(tickTimer); }, 130);
 
 setTimeout(()=>{
  S.busy=false;
  dealPrompt(live[targetIdx]);
  hud("SOCIAL ROULETTE",live[targetIdx].name,`${String(S.spins).padStart(3,'0')} SPINS`);
  Sfx.play('success');
 },4000);
}

function dealPrompt(pack){
 const pool=pack.p;
 const tpl=pool[Math.floor(Math.random()*pool.length)];
 const pA=roster[Math.floor(Math.random()*roster.length)];
 let pB=roster[Math.floor(Math.random()*roster.length)];
 if(pB===pA && roster.length>1) pB=roster.find(p=>p!==pA)||pA;
 
 const txt=tpl.replace(/\{A\}/g,`<em>${pA}</em>`).replace(/\{B\}/g,`<em>${pB}</em>`);
 $('promptCat').textContent=pack.name.toUpperCase();
 $('promptTxt').innerHTML=txt;
}

$('wheelHub').onclick=spinWheel;
$('btnSpin').onclick=spinWheel;
$('btnDid').onclick=()=>{ Sfx.play('success'); };
$('btnPassed').onclick=()=>{ Sfx.play('alert'); };

$('btnHub').onclick=()=>PD.exitToHub();

renderRoster();
renderPacks();
})();
</script>
</body>
</html>

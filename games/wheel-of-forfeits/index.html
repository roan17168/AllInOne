<style>
  :root {
    --bg-primary: #100b1a; --bg-surface: #1a1228; --bg-elevated: #281b3d;
    --text-primary: #ffffff; --text-secondary: #d6b4fc; --text-muted: #8b62b8;
    --accent: #ff007f; --accent-glow: rgba(255,0,127,0.45); --accent-contrast: #ffffff;
    --danger: #ff0044; --success: #00ffaa; --warning: #ffd000;
    --border-ui: rgba(255,0,127,0.28); --r-sm: 8px; --r-md: 14px; --r-lg: 20px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg-primary); color: var(--text-primary);
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    min-height: 100dvh; display: flex; flex-direction: column;
    overflow-x: hidden; user-select: none; -webkit-user-select: none;
  }
  .gm-top {
    position: sticky; top: 0; z-index: 40; display: flex; align-items: center; justify-content: space-between;
    gap: .75rem; padding: .55rem .9rem; background: var(--bg-surface); border-bottom: 1px solid var(--border-ui);
    padding-top: max(.55rem, env(safe-area-inset-top)); flex-shrink: 0;
  }
  .gm-idblock { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
  .gm-title { font-family: 'Space Grotesk', sans-serif; font-size: 1rem; font-weight: 900; }
  .gm-sub { font-family: 'Space Mono', monospace; font-size: .62rem; color: var(--accent); letter-spacing: .12em; text-transform: uppercase; }
  .gm-actions { display: flex; gap: .4rem; }
  .btn-icon-only {
    width: 44px; height: 44px; min-height: 44px; border-radius: var(--r-sm);
    background: var(--bg-elevated); border: 1px solid var(--border-ui);
    color: var(--text-primary); display: flex; align-items: center; justify-content: center;
    cursor: pointer; text-decoration: none;
  }
  .stage { flex: 1; display: flex; flex-direction: column; position: relative; overflow-y: auto; }
  .screen {
    display: none; flex-direction: column; gap: 1rem; padding: 1.1rem;
    max-width: 600px; margin: 0 auto; width: 100%; min-height: 100%;
  }
  .screen.is-active { display: flex; }

  /* Wheel Stage */
  .wheel-viewport {
    position: relative; width: 100%; max-width: 340px; aspect-ratio: 1;
    margin: 0 auto; display: flex; align-items: center; justify-content: center;
  }
  #wheelCanvas { width: 100%; height: 100%; display: block; border-radius: 50%; touch-action: none; }
  .wheel-pointer {
    position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
    width: 24px; height: 32px; z-index: 10; color: #ffffff;
    filter: drop-shadow(0 0 10px var(--accent));
  }
  .wheel-center-hub {
    position: absolute; width: 62px; height: 62px; border-radius: 50%;
    background: var(--bg-elevated); border: 3px solid var(--accent);
    box-shadow: 0 0 18px var(--accent-glow); display: flex; flex-direction: column;
    align-items: center; justify-content: center; pointer-events: none;
  }

  /* Category Chips */
  .chip-grid { display: flex; flex-wrap: wrap; gap: .45rem; }
  .cat-chip {
    padding: .45rem .8rem; min-height: 42px; border-radius: var(--r-sm);
    background: var(--bg-elevated); border: 1px solid var(--border-ui);
    color: var(--text-secondary); font-family: 'Space Mono', monospace; font-size: .75rem;
    font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px;
  }
  .cat-chip.is-active {
    background: var(--accent); color: #fff; border-color: var(--accent);
    box-shadow: 0 0 12px var(--accent-glow);
  }

  /* Panels & Verdict */
  .panel {
    background: var(--bg-surface); border: 1px solid var(--border-ui);
    border-radius: var(--r-md); padding: 1rem; box-shadow: 0 10px 30px rgba(0,0,0,.6);
  }
  .panel-title {
    font-family: 'Space Mono', monospace; font-size: .62rem;
    letter-spacing: .14em; text-transform: uppercase; color: var(--text-muted); margin-bottom: .6rem;
  }
  .btn {
    width: 100%; min-height: 52px; display: flex; align-items: center; justify-content: center; gap: 8px;
    background: var(--accent); color: #fff; border: none; border-radius: var(--r-sm);
    font-family: 'Space Mono', monospace; font-size: .88rem; font-weight: 800; text-transform: uppercase;
    box-shadow: 0 0 16px var(--accent-glow); cursor: pointer; text-decoration: none;
  }
  .btn:active { transform: scale(.98); }
  .btn.ghost { background: transparent; color: var(--text-secondary); border: 1px solid var(--border-ui); box-shadow: none; }
  .btn.danger { background: var(--danger); color: #fff; box-shadow: 0 0 16px rgba(255,0,68,.4); }

  /* 3-Stage Privacy Curtain */
  .curtain {
    position: fixed; inset: 0; z-index: 100; background: rgba(16, 11, 26, 0.96);
    backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; padding: 1.4rem;
  }
  .curtain.is-open { display: flex; }
  .cur-card {
    background: var(--bg-surface); border: 2px solid var(--accent); border-radius: var(--r-lg);
    padding: 2rem 1.4rem; width: 100%; max-width: 380px; text-align: center; box-shadow: 0 0 35px var(--accent-glow);
  }
  .hold-btn {
    position: relative; overflow: hidden; width: 100%; min-height: 60px;
    border-radius: var(--r-md); background: var(--bg-elevated); border: 1px solid var(--accent);
    color: var(--text-primary); font-family: 'Space Mono', monospace; font-size: .86rem; font-weight: 800;
    cursor: pointer; touch-action: none; margin-top: 1.2rem; display: flex; align-items: center; justify-content: center;
  }
  .hold-fill {
    position: absolute; left: 0; top: 0; bottom: 0; width: 0%;
    background: var(--accent); opacity: .85; transition: width .04s linear;
  }
  .hold-label { position: relative; z-index: 2; pointer-events: none; }
  .hold-btn.armed .hold-label { color: #fff; }

  .ico { display: inline-flex; width: 18px; height: 18px; flex-shrink: 0; }
  .ico svg { width: 100%; height: 100%; }
</style>

<!-- 4. PRIVACY CURTAIN -->

<script>
(function(){
"use strict";

/* ================= WEB AUDIO SYNTH ================= */
const Synth = {
  ctx: null,
  init(){ if(!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
  pegTick(freq = 800){
    try {
      this.init();
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = "triangle"; o.frequency.setValueAtTime(freq, this.ctx.currentTime);
      g.gain.setValueAtTime(0.08, this.ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.025);
      o.connect(g); g.connect(this.ctx.destination);
      o.start(); o.stop(this.ctx.currentTime + 0.025);
    }catch(e){}
  },
  landed(){
    try {
      this.init();
      [523, 659, 784, 1046].forEach((f, i) => {
        setTimeout(() => {
          const o = this.ctx.createOscillator(), g = this.ctx.createGain();
          o.type = "triangle"; o.frequency.setValueAtTime(f, this.ctx.currentTime);
          g.gain.setValueAtTime(0.14, this.ctx.currentTime);
          g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.15);
          o.connect(g); g.connect(this.ctx.destination);
          o.start(); o.stop(this.ctx.currentTime + 0.15);
        }, i * 65);
      });
    }catch(e){}
  }
};

/* ================= 120+ FORFEIT DATASET ================= */
const TASKS = {
  dare: [
    "Do 10 pushups while maintaining eye contact with the person across from you.",
    "Let the group style your hair into a runway disaster.",
    "Speak only in whispers for the next 2 rounds.",
    "Do your absolute best impersonation of another player until someone guesses who it is.",
    "Let the player to your right write a word on your forehead in imaginary ink.",
    "Hold a 30-second plank right now.",
    "Give a 45-second passionate speech about why pineapple belongs on pizza.",
    "Show the last 3 photos in your phone's camera roll to the table.",
    "Narrate the next round like a high-stakes nature documentary.",
    "Exchange drinks with the player on your left for 1 round."
  ],
  drink: [
    "Take 2 penalty sips immediately.",
    "Take 3 sips and nominate any rival to take 2 with you.",
    "Waterfall: You start drinking, everyone follows until you stop!",
    "Take 1 sip for every social media app on your home screen.",
    "Toast to the table and take 4 solid sips.",
    "The player with the lowest battery percentage drinks 3 sips.",
    "Everyone with glasses or contacts takes 2 sips.",
    "Take a sip without using your hands.",
    "Assign 4 sips split between two different opponents.",
    "Take 2 sips if you have texted someone today."
  ],
  rule: [
    "New Rule: Nobody may say the word 'DRINK' or they take a sip penalty.",
    "New Rule: You must hold your cup with your non-dominant hand for the rest of the game.",
    "New Rule: T-Rex Arms! Keep your elbows glued to your ribs when picking up your glass.",
    "New Rule: Every time someone laughs, they must tap the table twice.",
    "New Rule: You are now the Question Master. Anyone answering you must drink.",
    "New Rule: Speak in rhymes until your next turn or drink 2 sips.",
    "New Rule: No pointing fingers at anyone. Elbow points only!",
    "New Rule: Eye contact with the host requires a respectful head nod."
  ],
  confess: [
    "Reveal the most embarrassing purchase you have made in the past year.",
    "Who at this table would survive the longest in a zombie apocalypse?",
    "Confess your absolute worst habit when nobody is watching.",
    "Tell the story of your most awkward first date.",
    "What is a popular movie or band that everyone loves but you secretly hate?",
    "Admit the dumbest way you have ever injured yourself.",
    "What is the longest you have gone without showering?",
    "If you had to trade lives with one person in this room, who is it?"
  ],
  showdown: [
    "Staring Contest with the player to your left. Loser drinks 3 sips!",
    "Thumb War Showdown! Pick any player to duel for 2 sips.",
    "Rock-Paper-Scissors best of 3 against the host. Loser drinks 2 sips.",
    "Name 5 dog breeds in 7 seconds or drink 3 sips.",
    "Alphabet category duel: Name countries back-and-forth until one hesitates!",
    "Arm wrestle duel with the player opposite you."
  ],
  immune: [
    "IMMUNITY SHIELD! Keep this card to cancel any future drink penalty.",
    "SAFE HAVEN! Distribute 3 sips across the room without drinking.",
    "REVERSE CARD! Reflect the next forfeit targeted at you back to the sender.",
    "VIP PASS: Choose any player to take your next turn's forfeit."
  ]
};

const CATEGORY_META = {
  dare: { label: "DARE", color: "#ff007f" },
  drink: { label: "DRINK", color: "#ff0044" },
  rule: { label: "RULE", color: "#ffd000" },
  confess: { label: "CONFESS", color: "#00e5ff" },
  showdown: { label: "DUEL", color: "#a855f7" },
  immune: { label: "SHIELD", color: "#00ffaa" }
};

let activeCats = ["dare", "drink", "rule", "confess", "showdown", "immune"];
let roster = [];
try {
  const raw = localStorage.getItem("partydeck_players");
  roster = raw ? JSON.parse(raw) : [];
} catch(e){}
if(!Array.isArray(roster) || roster.length < 2) roster = ["Alex", "Jordan", "Taylor"];

const S = {
  playerIdx: 0,
  angle: 0,
  angVel: 0,
  spinning: false
};

const $ = id => document.getElementById(id);
function showScreen(id){
  document.querySelectorAll(".screen").forEach(s => s.classList.toggle("is-active", s.id === id));
}

/* ================= 3-STAGE PRIVACY CURTAIN ================= */
let holdTimer = null, holdStart = 0;
const HOLD_MS = 700;

function openCurtain(pName, onUnlock){
  $("curName").textContent = pName;
  $("holdFill").style.width = "0%";
  $("btnCurtainHold").classList.remove("armed");
  $("curtain").classList.add("is-open");

  const btn = $("btnCurtainHold");
  const cancel = e => {
    if(e) e.preventDefault();
    if(holdTimer) cancelAnimationFrame(holdTimer);
    holdTimer = null;
    $("holdFill").style.width = "0%";
    btn.classList.remove("armed");
  };
  const start = e => {
    e.preventDefault();
    btn.classList.add("armed");
    holdStart = performance.now();
    const tick = now => {
      const el = now - holdStart;
      const pct = Math.min(100, (el / HOLD_MS) * 100);
      $("holdFill").style.width = pct + "%";
      if(el >= HOLD_MS){
        cancel();
        $("curtain").classList.remove("is-open");
        onUnlock();
      } else {
        holdTimer = requestAnimationFrame(tick);
      }
    };
    holdTimer = requestAnimationFrame(tick);
  };

  btn.onpointerdown = start;
  btn.onpointerup = cancel;
  btn.onpointercancel = cancel;
  btn.onpointerleave = cancel;
}

/* ================= 2D CANVAS WHEEL ENGINE ================= */
const cvs = $("wheelCanvas");
const ctx = cvs.getContext("2d");
let W = 320, H = 320, DPR = 1;

function resizeCanvas(){
  const wrap = cvs.parentElement;
  const width = wrap.clientWidth;
  const height = wrap.clientHeight;
  if(width <= 16 || height <= 16) return;
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  W = width;
  H = height;
  cvs.width = W * DPR;
  cvs.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawWheel();
}
window.addEventListener("resize", resizeCanvas);
window.addEventListener("orientationchange", () => setTimeout(resizeCanvas, 200));

function drawWheel(){
  ctx.clearRect(0, 0, W, H);
  const cx = W / 2, cy = H / 2, r = Math.min(W, H) / 2 - 8;
  if(r <= 0) return;
  const wedges = activeCats.length;
  if(wedges === 0) return;
  const slice = (Math.PI * 2) / wedges;

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(S.angle);

  for(let i = 0; i < wedges; i++){
    const cat = activeCats[i];
    const meta = CATEGORY_META[cat];
    const a0 = i * slice;
    const a1 = a0 + slice;

    // Wedge Fill
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, r, a0, a1);
    ctx.fillStyle = meta.color;
    ctx.fill();

    // Border
    ctx.strokeStyle = "#100b1a";
    ctx.lineWidth = 3;
    ctx.stroke();

    // Wedge Text
    ctx.save();
    ctx.rotate(a0 + slice / 2);
    ctx.textAlign = "right";
    ctx.fillStyle = "#ffffff";
    ctx.font = "900 12px 'Space Mono', monospace";
    ctx.fillText(meta.label, r - 22, 4);
    ctx.restore();

    // Pegs on Rim
    const px = Math.cos(a0) * (r - 4);
    const py = Math.sin(a0) * (r - 4);
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(px, py, 4, 0, Math.PI*2); ctx.fill();
  }

  ctx.restore();
}

let lastPegIdx = -1;
let lastT = performance.now();

function spinLoop(t){
  if(!S.spinning) return;
  const dt = Math.min((t - lastT) / 1000, 0.033);
  lastT = t;

  S.angle += S.angVel * dt;
  S.angVel *= 0.985; // Drag friction

  // Peg clack trigger calculation
  const wedges = activeCats.length;
  const slice = (Math.PI * 2) / wedges;
  const norm = ((S.angle % (Math.PI * 2)) + (Math.PI * 2)) % (Math.PI * 2);
  const currentPeg = Math.floor(norm / slice);
  if(currentPeg !== lastPegIdx){
    lastPegIdx = currentPeg;
    Synth.pegTick(600 + (S.angVel * 30));
  }

  drawWheel();

  if(Math.abs(S.angVel) < 0.05){
    S.spinning = false;
    S.angVel = 0;
    Synth.landed();
    resolveSpin();
    return;
  }

  requestAnimationFrame(spinLoop);
}

function launchSpin(power = 18){
  if(S.spinning || activeCats.length === 0) return;
  S.angVel = power + Math.random() * 8;
  S.spinning = true;
  lastT = performance.now();
  requestAnimationFrame(spinLoop);
}

function resolveSpin(){
  const wedges = activeCats.length;
  const slice = (Math.PI * 2) / wedges;
  // Pointer is at TOP (-PI/2)
  const pointerAngle = (3 * Math.PI / 2);
  let relAngle = (pointerAngle - S.angle) % (Math.PI * 2);
  if(relAngle < 0) relAngle += Math.PI * 2;
  const landedIdx = Math.floor(relAngle / slice) % wedges;
  const landedCat = activeCats[landedIdx];

  const pool = TASKS[landedCat] || TASKS.dare;
  const task = pool[Math.floor(Math.random() * pool.length)];

  $("verdictCategory").textContent = CATEGORY_META[landedCat].label;
  $("verdictCategory").style.color = CATEGORY_META[landedCat].color;
  $("verdictTarget").textContent = roster[S.playerIdx];
  $("verdictTask").textContent = task;

  setTimeout(() => { showScreen("scrVerdict"); }, 600);
}

/* ================= INTERACTION ================= */
$("btnSpinWheel").onclick = () => launchSpin(22);

// Touch drag spin interaction on Canvas
let dragStartAngle = 0, dragLastAngle = 0, dragging = false, dragTime = 0;
cvs.addEventListener("pointerdown", e => {
  if(S.spinning) return;
  const rect = cvs.getBoundingClientRect();
  const cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
  dragStartAngle = Math.atan2(e.clientY - cy, e.clientX - cx);
  dragLastAngle = dragStartAngle;
  dragTime = performance.now();
  dragging = true;
  cvs.setPointerCapture(e.pointerId);
});

cvs.addEventListener("pointermove", e => {
  if(!dragging) return;
  const rect = cvs.getBoundingClientRect();
  const cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
  const curAngle = Math.atan2(e.clientY - cy, e.clientX - cx);
  const delta = curAngle - dragLastAngle;
  S.angle += delta;
  dragLastAngle = curAngle;
  drawWheel();
});

const endWheelDrag = () => {
  if(!dragging) return;
  dragging = false;
  const elapsed = (performance.now() - dragTime) / 1000;
  if(elapsed < 0.25){
    launchSpin(20);
  }
};
cvs.addEventListener("pointerup", endWheelDrag);
cvs.addEventListener("pointercancel", endWheelDrag);

// Category Selection Toggle
$("catGrid").onclick = e => {
  const chip = e.target.closest(".cat-chip"); if(!chip) return;
  const cat = chip.dataset.cat;
  chip.classList.toggle("is-active");
  if(chip.classList.contains("is-active")){
    if(!activeCats.includes(cat)) activeCats.push(cat);
  } else {
    activeCats = activeCats.filter(c => c !== cat);
  }
  if(activeCats.length === 0){
    chip.classList.add("is-active");
    activeCats.push(cat);
  }
  drawWheel();
};

// Roster
function renderRoster(){
  $("rosterList").innerHTML = roster.map((p, i) => `
    <li style="display:flex;justify-content:space-between;padding:.35rem .6rem;background:var(--bg-elevated);border-radius:var(--r-sm);border:1px solid var(--border-ui);">
      <span>#${i+1} ${p}</span>
      <span style="color:var(--accent);">SPINNER</span>
    </li>
  `).join("");
}

$("btnStartGame").onclick = () => {
  S.playerIdx = 0;
  startTurn();
};

function startTurn(){
  const player = roster[S.playerIdx];
  $("topSub").textContent = `${player}'s Turn`;
  $("hudSpinner").textContent = player;
  openCurtain(player, () => {
    showScreen("scrPlay");
    requestAnimationFrame(resizeCanvas);
  });
}

$("btnCompleteTask").onclick = $("btnRefuseTask").onclick = () => {
  S.playerIdx = (S.playerIdx + 1) % roster.length;
  startTurn();
};

document.addEventListener("DOMContentLoaded", () => {
  renderRoster();
});
})();
</script>

<!DOCTYPE html>
<html lang="en" data-theme="nordic-slate">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0e1117" id="metaThemeColor" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PartyDeck" />
  <title>PartyDeck | Offline Party Game Studio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Space+Grotesk:wght@700;900&family=Space+Mono:wght@400;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/themes.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/hub.css" />

  <style>
    /* Dev-only registry report overlay. Activated with ?verify=1 */
    .verify-overlay{position:fixed;inset:0;z-index:300;background:rgba(5,7,10,.97);
      overflow-y:auto;-webkit-overflow-scrolling:touch;padding:1rem;
      padding-top:max(1rem,env(safe-area-inset-top));
      padding-bottom:max(2rem,calc(env(safe-area-inset-bottom) + 1.2rem));
      font-family:'Space Mono',monospace;font-size:.72rem;line-height:1.55;display:none}
    .verify-overlay.is-open{display:block}
    .verify-overlay h3{font-family:'Space Grotesk',sans-serif;font-size:1rem;margin:1rem 0 .4rem}
    .v-ok{color:#00ffaa}.v-bad{color:#ff0055}.v-warn{color:#ffd000}.v-dim{color:#627288}
    .v-btn{width:100%;min-height:46px;margin-bottom:.5rem;background:#1f2633;color:#f0f4f8;
      border:1px solid rgba(148,163,184,.22);border-radius:8px;
      font-family:'Space Mono',monospace;font-weight:800;font-size:.72rem;cursor:pointer}
    .v-btn.primary{background:#38bdf8;color:#031525;border-color:#38bdf8}
    .v-row{padding:.2rem 0;border-bottom:1px solid rgba(148,163,184,.08);word-break:break-all}
    .v-pre{background:#0b0f16;border:1px solid rgba(148,163,184,.18);border-radius:8px;
      padding:.6rem;margin-top:.5rem;white-space:pre-wrap;word-break:break-all;
      max-height:40vh;overflow-y:auto;color:#a3cfbe;font-size:.66rem}
  </style>
</head>
<body>
<div class="hub-root">

  <!-- ==================== HEADER ==================== -->
  <header class="hub-header">
    <div class="hub-top-bar">
      <div class="hub-brand-group">
        <div class="hub-logo-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
        </div>
        <div class="hub-brand-text">
          <span class="hub-title">PARTYDECK</span>
          <span class="hub-subtitle" id="hubModuleCount">LOADING</span>
        </div>
      </div>
      <div class="hub-actions-cluster">
        <button type="button" class="btn-hub-icon" id="btnOpenRoster" aria-label="Lineup and mascots">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span class="roster-badge-pill" id="rosterBadgeCount">0</span>
        </button>
        <button type="button" class="btn-hub-icon" id="btnFullscreen" aria-label="Fullscreen mode">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        </button>
      </div>
    </div>

    <div class="theme-strip" id="themeStrip">
      <button type="button" class="theme-chip is-active" data-theme="nordic-slate"><span class="theme-dot"></span>Nordic Slate</button>
      <button type="button" class="theme-chip" data-theme="tokyo-sunset"><span class="theme-dot"></span>Tokyo Sunset</button>
      <button type="button" class="theme-chip" data-theme="terracotta-clay"><span class="theme-dot"></span>Terracotta</button>
      <button type="button" class="theme-chip" data-theme="emerald-lounge"><span class="theme-dot"></span>Emerald</button>
      <button type="button" class="theme-chip" data-theme="alpine-mist"><span class="theme-dot"></span>Alpine Mist</button>
      <button type="button" class="theme-chip" data-theme="synthwave-84"><span class="theme-dot"></span>Synthwave 84</button>
    </div>
  </header>

  <!-- ==================== SEARCH ==================== -->
  <section class="search-wrapper">
    <div class="search-input-box">
      <svg class="search-ico-lens" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="hubSearchInput" class="search-input" placeholder="Search games, tags or aliases..." autocomplete="off" autocorrect="off" spellcheck="false" />
      <button type="button" class="search-clear-btn" id="btnSearchClear" aria-label="Clear search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
  </section>

  <!-- ==================== SWIMLANE STAGE ==================== -->
  <main class="hub-stage" id="hubStage">
    <section class="swimlane-section" id="lane-search" style="display:none;padding:0 .9rem;">
      <h2 class="swimlane-title" id="searchMatchTitle" style="margin-bottom:.6rem;">Matches</h2>
      <div id="searchGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:.55rem;"></div>
    </section>
    <div id="laneHost"></div>
  </main>
</div>

<!-- ==================== QUICK-VIEW SHEET ==================== -->
<div class="preview-modal-backdrop" id="previewModal">
  <div class="preview-sheet">
    <div class="sheet-header">
      <div class="sheet-icon-box" id="sheetIcon"></div>
      <div class="sheet-title-meta">
        <h2 id="sheetTitle">Game</h2>
        <p class="sheet-tagline" id="sheetTagline"></p>
      </div>
    </div>
    <div class="sheet-badges-row" id="sheetBadgesRow"></div>
    <p class="sheet-desc" id="sheetDescription"></p>
    <div class="sheet-actions">
      <button type="button" class="btn-sheet-close" id="btnSheetClose" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <a href="#" class="btn-launch" id="btnSheetLaunch">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        Launch Game
      </a>
    </div>
  </div>
</div>

<div class="pd-toast" id="pdToast">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
  <span id="toastMsg">Ready</span>
</div>

<!-- ==================== VERIFY OVERLAY ==================== -->
<div class="verify-overlay" id="verifyOverlay">
  <button type="button" class="v-btn" id="btnVerifyClose">CLOSE REPORT</button>
  <div id="verifyBody"></div>
</div>

<script src="js/avatar-engine.js"></script>

    ["decrypto-blitz","Decrypto","deduction",4,10,0,"Cipher","cipher","Three-digit keyword encryption race."],
    ["cheat-bullshit","Bullshit Cheat","deduction",2,8,1,"Shedding","cards","Card shedding bluff with a giant call buzzer."],
    ["liars-dice-3d","Liars Dice 3D","deduction",2,6,0,"Dice","dice","Pass-and-shake 3D cup bluff bidding ladder."],
    ["two-rooms-spy","Two Rooms Spy","deduction",6,16,0,"Hostages","rooms","President vs Bomber hostage split across two phones."],
    ["two-rooms-boom","Boom Terminal","deduction",6,16,0,"Terminal","rooms","Full terminal hostage trading engine."],
    ["radio-morse-intercept","Morse Intercept","deduction",2,8,0,"Audio","radio","Web Audio coded transmission decoding."],
    ["wavelength-pocket","Wavelength","deduction",2,12,0,"Spectrum","dial","Binary psychic spectrum dial tuning."],
    ["medusa-360-gaze","Medusa Gaze","deduction",3,10,1,"Radial","eye","Centre-table radial eye contact showdown."],
    ["space-team-relay","Spaceteam","deduction",2,8,0,"Co-op","rocket","Two-phone shouting bridge console relay."],
    ["dual-tele-relay","Dual Relay","deduction",4,12,0,"2-Phone","pen","Parallel track comic sketch relay."],

    /* ---- HIGH-ENERGY & DRINKING ---- */
    ["kings-chalice","Kings Chalice","drinking",2,12,1,"Cards","cup","Digital Ring of Fire with a live chalice fill meter."],
    ["kings-chalice-deluxe","Kings Deluxe","drinking",2,12,1,"Custom","cup","House-rule editor plus interactive chalice."],
    ["irish-gauge-poker","Irish Poker","drinking",2,8,1,"Cards","cards","Four-card blind prediction betting gauntlet."],
    ["ride-the-bus","Ride The Bus","drinking",2,8,1,"Pyramid","pyramid","Fifteen-card pyramid match sudden death."],
    ["president-scum","President Scum","drinking",3,8,1,"Hierarchy","crown","Multi-round hierarchy card shedding."],
    ["higher-lower-death","Death Cards","drinking",2,8,1,"Streak","arrow","Accumulating pot higher/lower streak run."],
    ["never-have-i-ever-arcade","Never Have I","drinking",2,12,1,"3 Lives","heart","Arcade life-counter secret confession."],
    ["truth-or-drink-vault","Truth Vault","drinking",2,12,1,"Vault","vault","Three-tier steel vault confession cards."],
    ["do-or-drink","Do Or Drink","drinking",2,12,1,"Dares","bolt","Tiered dare cards with scaling penalties."],
    ["most-likely-to","Most Likely To","drinking",3,12,1,"Poll","ballot","Anonymous hot-seat pointing ballots."],
    ["rapid-buzzer","Rapid Buzzer","drinking",4,12,1,"Timer","clock","Accelerating pass-the-potato buzzer."],
    ["rapid-heartbeat-buzzer","Heartbeat Pass","drinking",3,12,1,"Audio","pulse","Biological heartbeat fuse potato pass."],
    ["bomb-countdown","Timebomb","drinking",3,12,1,"Fuse","bomb","Fast word pass with a detonating fuse."]
  ];

  var ALL_GAMES = RAW.map(function (r) {
    return {
      id:r[0], title:r[1], category:r[2],
      minP:r[3], maxP:r[4], drink:!!r[5],
      tag:r[6], icon:ICONS[r[7]] || ICONS.ring, desc:r[8],
      path:"games/" + r[0] + "/index.html"
    };
  });

  /* ==================================================================
     STATIC INTEGRITY AUDIT
     Catches the exact bug class that produced the old duplicate
     Quick-Draw entry, at load time, before anything renders.
     ================================================================== */
  var AUDIT = (function () {
    var seen = {}, dupIds = [], badCat = [], badIcon = [];
    var valid = CATS.map(function (c) { return c.key; });
    ALL_GAMES.forEach(function (g) {
      if (seen[g.id]) dupIds.push(g.id); else seen[g.id] = 1;
      if (valid.indexOf(g.category) === -1) badCat.push(g.id);
      if (!g.icon) badIcon.push(g.id);
    });
    return { total: ALL_GAMES.length, dupIds: dupIds, badCat: badCat, badIcon: badIcon };
  })();

  if (AUDIT.dupIds.length) console.error("[PartyDeck] Duplicate IDs:", AUDIT.dupIds);
  if (AUDIT.badCat.length) console.error("[PartyDeck] Bad categories:", AUDIT.badCat);
  console.info("[PartyDeck] Registry loaded:", AUDIT.total, "unique modules.");
  $("hubModuleCount").textContent = AUDIT.total + " OFFLINE MODULES";

  /* ==================================================================
     RENDERING
     ================================================================== */
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" })[c];
    });
  }

  function renderCard(g) {
    return '<div class="game-card-compact" data-id="' + esc(g.id) + '" role="button" tabindex="0">' +
      '<div class="card-top-badges">' +
        '<span class="card-p-pill"><svg viewBox="0 0 24 24" ' + SW + '><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>' + g.minP + '-' + g.maxP + '</span>' +
        (g.drink ? '<span class="card-drink-dot" title="Drinking game"></span>' : '') +
      '</div>' +
      '<div class="card-center-icon">' + g.icon + '</div>' +
      '<div class="card-compact-title">' + esc(g.title) + '</div>' +
      '<span class="card-tag-pill">' + esc(g.tag) + '</span>' +
    '</div>';
  }

  function buildLanes() {
    var html = "";
    CATS.forEach(function (c) {
      var games = ALL_GAMES.filter(function (g) { return g.category === c.key; });
      if (!games.length) return;
      html +=
        '<section class="swimlane-section" data-lane="' + c.key + '">' +
          '<div class="swimlane-header">' +
            '<div class="swimlane-title-group">' +
              '<span class="swimlane-ico">' + (ICONS[c.icon] || "") + '</span>' +
              '<h2 class="swimlane-title">' + esc(c.label) + '</h2>' +
            '</div>' +
            '<span class="swimlane-count">' + games.length + ' GAMES</span>' +
          '</div>' +
          '<div class="swimlane-track">' + games.map(renderCard).join("") + '</div>' +
        '</section>';
    });
    $("laneHost").innerHTML = html;
  }
  buildLanes();

  /* ==================================================================
     QUICK-VIEW SHEET
     ================================================================== */
  var previewModal = $("previewModal");

  function openSheet(id) {
    var g = ALL_GAMES.filter(function (x) { return x.id === id; })[0];
    if (!g) return;
    $("sheetIcon").innerHTML = g.icon;
    $("sheetTitle").textContent = g.title;
    $("sheetTagline").textContent = g.tag + " \u00B7 " + g.minP + "-" + g.maxP + " players";
    $("sheetDescription").textContent = g.desc;
    $("sheetBadgesRow").innerHTML =
      '<span class="sheet-pill">' + g.minP + '-' + g.maxP + ' Players</span>' +
      '<span class="sheet-pill">' + esc(g.tag) + '</span>' +
      (g.drink ? '<span class="sheet-pill drink">Drinking Mode</span>' : '');
    $("btnSheetLaunch").href = g.path;
    previewModal.classList.add("is-open");
  }
  function closeSheet() { previewModal.classList.remove("is-open"); }

  document.addEventListener("click", function (e) {
    var card = e.target.closest && e.target.closest(".game-card-compact");
    if (card) openSheet(card.dataset.id);
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closeSheet();
    if (e.key === "Enter" || e.key === " ") {
      var card = e.target.closest && e.target.closest(".game-card-compact");
      if (card) { e.preventDefault(); openSheet(card.dataset.id); }
    }
  });
  $("btnSheetClose").onclick = closeSheet;
  previewModal.onclick = function (e) { if (e.target === previewModal) closeSheet(); };

  /* ==================================================================
     SEARCH
     ================================================================== */
  var searchInput = $("hubSearchInput");
  var searchSection = $("lane-search");
  var searchGrid = $("searchGrid");
  var searchClear = $("btnSearchClear");

  function setLanesVisible(v) {
    var lanes = document.querySelectorAll("[data-lane]");
    for (var i = 0; i < lanes.length; i++) lanes[i].style.display = v ? "flex" : "none";
  }

  searchInput.addEventListener("input", function () {
    var q = searchInput.value.trim().toLowerCase();
    if (!q) {
      searchClear.classList.remove("is-active");
      searchSection.style.display = "none";
      setLanesVisible(true);
      return;
    }
    searchClear.classList.add("is-active");
    setLanesVisible(false);
    searchSection.style.display = "block";
    var matches = ALL_GAMES.filter(function (g) {
      return (g.title + " " + g.id + " " + g.tag + " " + g.desc).toLowerCase().indexOf(q) !== -1;
    });
    $("searchMatchTitle").textContent = "Matches (" + matches.length + ")";
    searchGrid.innerHTML = matches.length
      ? matches.map(renderCard).join("")
      : '<div style="grid-column:1/-1;text-align:center;padding:2rem;color:var(--text-muted);font-family:var(--font-mono);font-size:.82rem;">No games match "' + esc(q) + '"</div>';
  });

  searchClear.onclick = function () {
    searchInput.value = "";
    searchClear.classList.remove("is-active");
    searchSection.style.display = "none";
    setLanesVisible(true);
    searchInput.blur();
  };

  /* ==================================================================
     THEME SWITCHER
     ================================================================== */
  (function initTheme() {
    var saved = null;
    try { saved = localStorage.getItem("partydeck_theme"); } catch (e) {}
    if (!saved) return;
    document.documentElement.setAttribute("data-theme", saved);
    var chips = document.querySelectorAll(".theme-chip");
    for (var i = 0; i < chips.length; i++) {
      chips[i].classList.toggle("is-active", chips[i].dataset.theme === saved);
    }
  })();

  $("themeStrip").addEventListener("click", function (e) {
    var chip = e.target.closest && e.target.closest(".theme-chip");
    if (!chip) return;
    var chips = document.querySelectorAll(".theme-chip");
    for (var i = 0; i < chips.length; i++) chips[i].classList.remove("is-active");
    chip.classList.add("is-active");
    document.documentElement.setAttribute("data-theme", chip.dataset.theme);
    try { localStorage.setItem("partydeck_theme", chip.dataset.theme); } catch (err) {}
    showToast("Theme: " + chip.textContent.trim());
  });

  /* ==================================================================
     FULLSCREEN / iOS PWA RESILIENCE
     Never throws on vendor APIs that return void or reject.
     ================================================================== */
  $("btnFullscreen").onclick = function () {
    var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    var standalone = window.navigator.standalone ||
      (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);

    if (isIOS) {
      showToast(standalone ? "Already running fullscreen." : "Share menu, then Add to Home Screen.");
      return;
    }
    var fsEl = document.fullscreenElement || document.webkitFullscreenElement;
    if (!fsEl) {
      var el = document.documentElement;
      var rfs = el.requestFullscreen || el.webkitRequestFullscreen;
      if (!rfs) { showToast("Fullscreen unsupported here."); return; }
      try {
        var p = rfs.call(el);
        if (p && typeof p.catch === "function") {
          p.catch(function () { showToast("Fullscreen blocked by browser."); });
        }
      } catch (err) { showToast("Fullscreen blocked by browser."); }
    } else {
      var efs = document.exitFullscreen || document.webkitExitFullscreen;
      if (efs) { try { efs.call(document); } catch (err) {} }
    }
  };

  /* ==================================================================
     ROSTER BRIDGE (avatar-engine.js)
     ================================================================== */
  function updateRosterBadge() {
    if (!window.PartyDeckAvatars) return;
    var r = window.PartyDeckAvatars.getRoster() || [];
    $("rosterBadgeCount").textContent = r.length;
  }

  $("btnOpenRoster").onclick = function () {
    if (!window.PartyDeckAvatars) { showToast("Avatar engine not loaded."); return; }
    window.PartyDeckAvatars.openRosterModal(function (roster) {
      updateRosterBadge();
      showToast(roster.length + " players ready.");
    });
  };

  window.addEventListener("partydeck:rosterupdated", updateRosterBadge);
  updateRosterBadge();

  /* ==================================================================
     ?verify=1  — LIVE REGISTRY VERIFIER
     HEAD-probes every derived route against the real repo and reports
     dead links, duplicate IDs and category faults. Dev tool only.
     ================================================================== */
  function runVerifier() {
    var overlay = $("verifyOverlay");
    var body = $("verifyBody");
    overlay.classList.add("is-open");
    body.innerHTML = '<h3>PartyDeck Registry Report</h3>' +
      '<div class="v-dim">Probing ' + ALL_GAMES.length + ' routes...</div>';

    var results = [], done = 0;

    ALL_GAMES.forEach(function (g) {
      fetch(g.path, { method: "HEAD", cache: "no-store" })
        .then(function (res) { results.push({ g: g, ok: res.ok, code: res.status }); })
        .catch(function () { results.push({ g: g, ok: false, code: "ERR" }); })
        .then(function () {
          done++;
          if (done === ALL_GAMES.length) paint(results);
        });
    });

    function paint(res) {
      var missing = res.filter(function (r) { return !r.ok; });
      var live    = res.filter(function (r) { return r.ok; });

      var html = '<h3>PartyDeck Registry Report</h3>';
      html += '<div class="v-row">Registered modules: <strong>' + AUDIT.total + '</strong></div>';
      html += '<div class="v-row">Duplicate IDs: <span class="' + (AUDIT.dupIds.length ? "v-bad" : "v-ok") + '">' +
              (AUDIT.dupIds.length ? AUDIT.dupIds.join(", ") : "none") + '</span></div>';
      html += '<div class="v-row">Bad categories: <span class="' + (AUDIT.badCat.length ? "v-bad" : "v-ok") + '">' +
              (AUDIT.badCat.length ? AUDIT.badCat.join(", ") : "none") + '</span></div>';
      html += '<div class="v-row">Reachable routes: <span class="v-ok">' + live.length + '</span> of ' + res.length + '</div>';

      if (missing.length) {
        html += '<h3 class="v-bad">Dead routes (' + missing.length + ')</h3>';
        html += '<div class="v-dim">These IDs do not match a real folder. Rename the folder, or fix the id in RAW.</div>';
        missing.sort(function (a, b) { return a.g.id < b.g.id ? -1 : 1; });
        missing.forEach(function (r) {
          html += '<div class="v-row v-bad">' + esc(r.g.path) + '  [' + r.code + ']</div>';
        });
        html += '<div class="v-pre" id="vMissingList">' +
                missing.map(function (r) { return r.g.id; }).join("\n") + '</div>';
      } else {
        html += '<h3 class="v-ok">All routes resolved</h3>';
      }

      html += '<h3>Lane distribution</h3>';
      CATS.forEach(function (c) {
        var n = ALL_GAMES.filter(function (g) { return g.category === c.key; }).length;
        html += '<div class="v-row">' + esc(c.label) + ': <strong>' + n + '</strong></div>';
      });

      html += '<h3>Export</h3>';
      html += '<button type="button" class="v-btn primary" id="btnCopyLive">COPY LIVE IDS TO CLIPBOARD</button>';
      html += '<div class="v-pre" id="vLiveList">' +
              live.map(function (r) { return r.g.id; }).sort().join("\n") + '</div>';

      body.innerHTML = html;

      var copyBtn = $("btnCopyLive");
      if (copyBtn) {
        copyBtn.onclick = function () {
          var txt = $("vLiveList").textContent;
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(txt).then(
              function () { copyBtn.textContent = "COPIED " + live.length + " IDS"; },
              function () { copyBtn.textContent = "COPY FAILED - SELECT MANUALLY"; }
            );
          } else {
            copyBtn.textContent = "CLIPBOARD UNAVAILABLE - SELECT MANUALLY";
          }
        };
      }
    }
  }

  $("btnVerifyClose").onclick = function () {
    $("verifyOverlay").classList.remove("is-open");
  };

  if (/[?&]verify=1/.test(window.location.search)) {
    runVerifier();
  }

})();
</script>

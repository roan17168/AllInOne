<!DOCTYPE html>
<html lang="en" data-theme="nordic-slate">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0e1117" id="metaThemeColor" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>PartyDeck | Offline Static Party Hub</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Space+Grotesk:wght@700;900&family=Space+Mono:wght@400;700;800&display=swap" rel="stylesheet">

  <!-- Core Hub Stylesheet -->
  <link rel="stylesheet" href="css/hub.css" />

  <!-- Pre-Theme Bootstrapping -->
  <script>
    (function(){
      try {
        const saved = localStorage.getItem("partydeck_theme");
        if(saved) document.documentElement.setAttribute("data-theme", saved);
      } catch(e){}
    })();
  </script>
</head>
<body>

<div class="hub-root">
  <!-- 1. TOP PERSISTENT CONTROLS -->
  <header class="hub-header">
    <div class="brand-block" id="brandBtn">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12 2 2 7 12 12 22 7 12 2"/>
          <polyline points="2 17 12 22 22 17"/>
          <polyline points="2 12 12 17 22 12"/>
        </svg>
      </div>
      <div class="brand-text">
        <h1>PartyDeck</h1>
        <span>OFFLINE HUB</span>
      </div>
    </div>

    <div class="hub-actions">
      <!-- Mascot / Roster Launcher -->
      <button type="button" class="btn-header accent" id="btnRosterAvatars" title="Manage Roster & Mascots">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
          <path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        <span id="rosterCountBadge">ROSTER</span>
      </button>

      <!-- Fullscreen / iOS PWA helper -->
      <button type="button" class="btn-header btn-icon-only" id="btnFullscreen" title="Toggle Fullscreen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- 2. SUPER-SEARCH & PALETTE STRIP -->
  <section class="search-strip">
    <div class="search-input-wrap">
      <div class="search-icon-slot">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </div>
      <input type="text" id="superSearchInput" class="search-field" placeholder="Search games, aliases (e.g. Heads Up, Spyfall, Osu)..." autocomplete="off" />
      <button type="button" class="search-clear-btn" id="searchClearBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <!-- 6 Palettes -->
    <div class="theme-strip" id="themeStrip">
      <button type="button" class="theme-chip is-active" data-theme="nordic-slate"><span class="theme-dot"></span>Nordic Slate</button>
      <button type="button" class="theme-chip" data-theme="tokyo-sunset"><span class="theme-dot"></span>Tokyo Sunset</button>
      <button type="button" class="theme-chip" data-theme="terracotta-clay"><span class="theme-dot"></span>Terracotta</button>
      <button type="button" class="theme-chip" data-theme="emerald-lounge"><span class="theme-dot"></span>Emerald</button>
      <button type="button" class="theme-chip" data-theme="alpine-mist"><span class="theme-dot"></span>Alpine Mist</button>
      <button type="button" class="theme-chip" data-theme="synthwave-84"><span class="theme-dot"></span>Synthwave 84</button>
    </div>
  </section>

  <!-- 3. MAIN SWIMLANES HUB STAGE -->
  <main class="hub-stage" id="hubStage">
    <!-- Active Search Filter Target -->
    <section class="search-results-panel" id="searchResultsPanel">
      <div class="search-results-header" id="searchResultsHeader">Search Matches</div>
      <div class="search-grid" id="searchResultsGrid"></div>
    </section>

    <!-- Category Swimlane 1: Trending & Party Starters -->
    <section class="swimlane-section" id="lane-trending">
      <div class="swimlane-header">
        <div class="swimlane-title-group">
          <span class="swimlane-ico">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
            </svg>
          </span>
          <h2 class="swimlane-title">Trending &amp; Party Starters</h2>
        </div>
        <span class="swimlane-count" id="count-trending">5 GAMES</span>
      </div>
      <div class="swimlane-scroll" id="scroll-trending"></div>
    </section>

    <!-- Category Swimlane 2: Social Deduction & Bluffing -->
    <section class="swimlane-section" id="lane-deduction">
      <div class="swimlane-header">
        <div class="swimlane-title-group">
          <span class="swimlane-ico">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </span>
          <h2 class="swimlane-title">Social Deduction &amp; Bluffing</h2>
        </div>
        <span class="swimlane-count" id="count-deduction">8 GAMES</span>
      </div>
      <div class="swimlane-scroll" id="scroll-deduction"></div>
    </section>

    <!-- Category Swimlane 3: High-Energy & Drinking -->
    <section class="swimlane-section" id="lane-drinking">
      <div class="swimlane-header">
        <div class="swimlane-title-group">
          <span class="swimlane-ico">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 11h1a3 3 0 0 1 0 6h-1"/><path d="M9 12v6"/><path d="M13 12v6"/><path d="M5 6h14v12a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3V6Z"/><path d="M5 10h14"/>
            </svg>
          </span>
          <h2 class="swimlane-title">High-Energy &amp; Drinking</h2>
        </div>
        <span class="swimlane-count" id="count-drinking">8 GAMES</span>
      </div>
      <div class="swimlane-scroll" id="scroll-drinking"></div>
    </section>

    <!-- Category Swimlane 4: Arcade Reflex & Gauntlets -->
    <section class="swimlane-section" id="lane-arcade">
      <div class="swimlane-header">
        <div class="swimlane-title-group">
          <span class="swimlane-ico">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="8" cy="12" r="2"/><path d="M15 9v6M12 12h6"/>
            </svg>
          </span>
          <h2 class="swimlane-title">Arcade Reflex &amp; Gauntlets</h2>
        </div>
        <span class="swimlane-count" id="count-arcade">8 GAMES</span>
      </div>
      <div class="swimlane-scroll" id="scroll-arcade"></div>
    </section>

    <!-- Category Swimlane 5: Stim & Waiting Fidgets (Micro-Games) -->
    <section class="swimlane-section" id="lane-stim">
      <div class="swimlane-header">
        <div class="swimlane-title-group">
          <span class="swimlane-ico">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/><line x1="4.93" y1="4.93" x2="9.17" y2="9.17"/><line x1="14.83" y1="14.83" x2="19.07" y2="19.07"/><line x1="14.83" y1="9.17" x2="19.07" y2="4.93"/><line x1="4.93" y1="19.07" x2="9.17" y2="14.83"/>
            </svg>
          </span>
          <h2 class="swimlane-title">Stim &amp; Waiting Fidgets</h2>
        </div>
        <span class="swimlane-count" id="count-stim">5 GAMES</span>
      </div>
      <div class="swimlane-scroll" id="scroll-stim"></div>
    </section>
  </main>
</div>

<!-- 4. QUICK-VIEW EXPANSION BOTTOM SHEET -->
<div class="preview-modal-backdrop" id="previewModalBackdrop">
  <div class="preview-sheet" id="previewSheet">
    <div class="sheet-handle"></div>
    
    <div class="sheet-header">
      <div class="sheet-icon-box" id="sheetIconSlot">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"/></svg>
      </div>
      <div class="sheet-title-meta">
        <h2 id="sheetTitle">Game Title</h2>
        <p class="sheet-tagline" id="sheetTagline">Game Tagline</p>
      </div>
    </div>

    <div class="sheet-badges-row" id="sheetBadgesRow">
      <!-- Injected pills -->
    </div>

    <div class="sheet-desc" id="sheetDescription">
      Game description goes here.
    </div>

    <div class="sheet-actions">
      <button type="button" class="btn-sheet-close" id="btnSheetClose" title="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
      <a href="#" class="btn-launch" id="btnSheetLaunch">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
        <span>LAUNCH GAME</span>
      </a>
    </div>
  </div>
</div>

<!-- 5. TOAST COMPONENT -->
<div class="pd-toast" id="pdToast">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
  <span id="toastMsg">Ready</span>
</div>

  /* ==========================================================================
     2. DOM ELEMENTS & STATE
     ========================================================================== */
  const $ = id => document.getElementById(id);
  const toastEl = $("pdToast");
  const toastMsg = $("toastMsg");
  let toastTimer = null;

  function showToast(msg) {
    toastMsg.textContent = msg;
    toastEl.classList.add("is-active");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("is-active"), 2200);
  }

  /* ==========================================================================
     3. RENDER SWIMLANES
     ========================================================================== */
  function renderSwimlaneCard(game, matchedAlias = null) {
    return `
      <article class="game-card-compact" data-id="${game.id}">
        <div class="card-top-badges">
          <span class="card-p-pill">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
            ${game.minP}–${game.maxP}
          </span>
          ${game.drink ? '<span class="card-drink-dot" title="Drinking Game"></span>' : '<span></span>'}
        </div>
        <div class="card-center-icon">
          ${game.icon}
        </div>
        <div class="card-bottom-info">
          <h3 class="card-compact-title">${game.title}</h3>
          <span class="card-compact-tag">${game.time}</span>
          ${matchedAlias ? `<span class="search-match-badge">Alias: ${matchedAlias}</span>` : ''}
        </div>
      </article>
    `;
  }

  function populateSwimlanes() {
    const categories = ["trending", "deduction", "drinking", "arcade", "stim"];
    categories.forEach(cat => {
      const container = $(`scroll-${cat}`);
      if (!container) return;
      const games = ALL_GAMES.filter(g => g.category === cat);
      container.innerHTML = games.map(g => renderSwimlaneCard(g)).join("");
      const countEl = $(`count-${cat}`);
      if (countEl) countEl.textContent = `${games.length} GAMES`;
    });
  }

  /* ==========================================================================
     4. QUICK-VIEW EXPANSION BOTTOM SHEET
     ========================================================================== */
  const previewModal = $("previewModalBackdrop");
  const sheetIcon = $("sheetIconSlot");
  const sheetTitle = $("sheetTitle");
  const sheetTagline = $("sheetTagline");
  const sheetBadges = $("sheetBadgesRow");
  const sheetDesc = $("sheetDescription");
  const btnLaunch = $("btnSheetLaunch");
  const btnClose = $("btnSheetClose");

  function openGamePreview(game) {
    sheetIcon.innerHTML = game.icon;
    sheetTitle.textContent = game.title;
    sheetTagline.textContent = game.tagline;
    sheetDesc.textContent = game.description;
    btnLaunch.href = game.entryPath;

    sheetBadges.innerHTML = `
      <span class="badge-tag accent">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
        ${game.minP}–${game.maxP} Players
      </span>
      <span class="badge-tag">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        ${game.time}
      </span>
      ${game.drink ? '<span class="badge-tag accent" style="color:var(--danger);border-color:var(--danger);">Drinking Mode</span>' : ''}
      ${(game.tags || []).map(t => `<span class="badge-tag">${t}</span>`).join("")}
    `;

    previewModal.classList.add("is-open");
  }

  function closeGamePreview() {
    previewModal.classList.remove("is-open");
  }

  document.addEventListener("click", e => {
    const card = e.target.closest(".game-card-compact");
    if (card) {
      const gId = card.dataset.id;
      const game = ALL_GAMES.find(g => g.id === gId);
      if (game) openGamePreview(game);
    }
  });

  btnClose.addEventListener("click", closeGamePreview);
  previewModal.addEventListener("click", e => {
    if (e.target === previewModal) closeGamePreview();
  });

  /* ==========================================================================
     5. SUPER-SEARCH INTEGRATION
     ========================================================================== */
  const searchInput = $("superSearchInput");
  const searchClear = $("searchClearBtn");
  const searchPanel = $("searchResultsPanel");
  const searchGrid = $("searchResultsGrid");
  const searchHeader = $("searchResultsHeader");

  searchInput.addEventListener("input", () => {
    const q = searchInput.value.trim();
    searchClear.classList.toggle("is-active", q.length > 0);

    if (!q) {
      searchPanel.classList.remove("is-active");
      document.querySelectorAll(".swimlane-section").forEach(s => s.style.display = "flex");
      return;
    }

    document.querySelectorAll(".swimlane-section").forEach(s => s.style.display = "none");
    searchPanel.classList.add("is-active");

    if (window.PartyDeckSearch) {
      const results = window.PartyDeckSearch.query(q, ALL_GAMES);
      searchHeader.textContent = `Search Matches (${results.length})`;
      if (results.length === 0) {
        searchGrid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:2rem;color:var(--text-muted);font-family:var(--font-mono);font-size:.85rem;">No games found matching "${q}"</div>`;
      } else {
        searchGrid.innerHTML = results.map(r => renderSwimlaneCard(r.game, r.matchedAlias)).join("");
      }
    }
  });

  searchClear.addEventListener("click", () => {
    searchInput.value = "";
    searchClear.classList.remove("is-active");
    searchPanel.classList.remove("is-active");
    document.querySelectorAll(".swimlane-section").forEach(s => s.style.display = "flex");
  });

  /* ==========================================================================
     6. THEME SELECTOR & FULLSCREEN ENGINE
     ========================================================================== */
  const THEME_METAS = {
    "nordic-slate": "#0e1117",
    "tokyo-sunset": "#120e24",
    "terracotta-clay": "#1c1815",
    "emerald-lounge": "#071712",
    "alpine-mist": "#f4f6f9",
    "synthwave-84": "#100b1a"
  };

  function applyTheme(themeKey) {
    document.documentElement.setAttribute("data-theme", themeKey);
    const meta = $("metaThemeColor");
    if (meta && THEME_METAS[themeKey]) meta.setAttribute("content", THEME_METAS[themeKey]);
    try { localStorage.setItem("partydeck_theme", themeKey); } catch(e){}
    document.querySelectorAll(".theme-chip").forEach(c => {
      c.classList.toggle("is-active", c.dataset.theme === themeKey);
    });
  }

  $("themeStrip").addEventListener("click", e => {
    const chip = e.target.closest(".theme-chip");
    if (!chip) return;
    applyTheme(chip.dataset.theme);
  });

  function toggleFullscreen() {
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream ||
      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    const isStandalone = Boolean(window.navigator.standalone) ||
      (typeof window.matchMedia === "function" && window.matchMedia("(display-mode: standalone)").matches);

    if (isIOS) {
      if (isStandalone) {
        showToast("Already in Fullscreen Web App mode!");
      } else {
        showToast("Use Share, then Add to Home Screen, for fullscreen.");
      }
      return;
    }

    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      const el = document.documentElement;
      const rfs = el.requestFullscreen || el.webkitRequestFullscreen;
      if (!rfs) {
        showToast("Fullscreen mode is not available in this browser.");
        return;
      }
      try {
        Promise.resolve(rfs.call(el)).catch(() => showToast("Fullscreen mode blocked"));
      } catch(e) {
        showToast("Fullscreen mode blocked");
      }
    } else {
      const efs = document.exitFullscreen || document.webkitExitFullscreen;
      if (efs) {
        try { Promise.resolve(efs.call(document)).catch(() => {}); } catch(e) {}
      }
    }
  }

  $("btnFullscreen").addEventListener("click", toggleFullscreen);

  /* ==========================================================================
     7. KAHOOT-STYLE ROSTER & AVATAR ENGINE LAUNCHER
     ========================================================================== */
  function updateRosterBadge() {
    let players = [];
    try {
      const raw = localStorage.getItem("partydeck_players");
      if (raw) players = JSON.parse(raw);
    } catch(e){}
    const badge = $("rosterCountBadge");
    badge.textContent = players.length > 0 ? `${players.length} PLAYERS` : "ROSTER";
  }

  $("btnRosterAvatars").addEventListener("click", () => {
    if (window.PartyDeckAvatars) {
      window.PartyDeckAvatars.openAvatarPicker("", (result) => {
        let players = [];
        try {
          const raw = localStorage.getItem("partydeck_players");
          if (raw) players = JSON.parse(raw);
        } catch(e){}
        if (!players.includes(result.name)) {
          players.push(result.name);
          try { localStorage.setItem("partydeck_players", JSON.stringify(players)); } catch(e){}
        }
        updateRosterBadge();
        showToast(`Joined: ${result.name}`);
      });
    }
  });

  /* ==========================================================================
     8. BOOTSTRAP INITIALIZATION
     ========================================================================== */
  document.addEventListener("DOMContentLoaded", () => {
    let savedTheme = "nordic-slate";
    try { savedTheme = localStorage.getItem("partydeck_theme") || "nordic-slate"; } catch(e){}
    applyTheme(savedTheme);
    populateSwimlanes();
    updateRosterBadge();
  });
})();
</script>

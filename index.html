<!-- 2. iOS Home Screen Touch Icon Generator (Auto-converts Stack SVG to PNG for iOS Safari) -->

<meta name="apple-mobile-web-app-title" content="PartyDeck" />

<script>
(function() {
  // Synthesize 180x180 PNG touch icon dynamically so iOS renders a crisp home screen icon
  try {
    const cvs = document.createElement('canvas');
    cvs.width = 180;
    cvs.height = 180;
    const ctx = cvs.getContext('2d');

    // Background squircle
    ctx.fillStyle = '#0e1117';
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(0, 0, 180, 180, 40) : ctx.rect(0, 0, 180, 180);
    ctx.fill();

    // Subtle neon perimeter border
    ctx.strokeStyle = 'rgba(56, 189, 248, 0.4)';
    ctx.lineWidth = 4;
    ctx.stroke();

    // 3-Tier Isometric Card Stack
    function drawLayer(pts, strokeColor, fillColor) {
      ctx.beginPath();
      ctx.moveTo(pts[0][0], pts[0][1]);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
      if (fillColor) {
        ctx.closePath();
        ctx.fillStyle = fillColor;
        ctx.fill();
      }
      ctx.strokeStyle = strokeColor;
      ctx.lineWidth = 10;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.stroke();
    }

    // Top Card (Ice Blue)
    drawLayer([[90, 32], [26, 68], [90, 104], [154, 68]], '#38bdf8', '#1a2230');

    // Middle Card (Neon Pink)
    drawLayer([[26, 102], [90, 138], [154, 102]], '#ff0055', null);

    // Bottom Card (Neon Green)
    drawLayer([[26, 136], [90, 172], [154, 136]], '#00ffaa', null);

    // Attach base64 PNG data URL to apple-touch-icon tag
    const iconLink = document.getElementById('pd-apple-touch-icon');
    if (iconLink) iconLink.href = cvs.toDataURL('image/png');
  } catch (e) {}
})();
</script>

    ["neon-shuffleboard","Shuffleboard","arcade",2,6,1,"Friction","puck","Touch-slide puck hanger challenge."],
    ["rhythm-beat-smasher","Beat Smasher","arcade",1,4,1,"Highway","note","Four-lane note highway rhythm trial."],
    ["laser-bullet-hell","Bullet Hell","arcade",1,4,1,"Dodger","bolt","Geometric projectile dodging arena."],
    ["gyro-tilt-maze","Gyro Maze","arcade",1,4,1,"Sensors","maze","Accelerometer rolling marble maze."],
    ["quick-draw-duel","Quick-Draw","arcade",2,2,1,"Reaction","bolt","Split-screen two-player lift-speed duel."],
    ["finger-roulette","Finger Roulette","arcade",2,6,1,"Touch","ring","Multi-touch electric finger chooser."],
    ["five-second-blitz","5-Sec Blitz","arcade",2,10,1,"Marble","clock","Descending marble three-answer timer."],

    /* ---- SOCIAL DEDUCTION & BLUFF (14) ---- */
    ["resistance-cell","Resistance","deduction",5,10,0,"Traitor","shield","Five-mission sabotage traitor operations."],
    ["one-night-wolf","One Night Wolf","deduction",3,10,0,"Night","moon","Voice-narrated night role swap deduction."],
    ["decrypto-blitz","Decrypto","deduction",4,10,0,"Cipher","cipher","Three-digit keyword encryption race."],
    ["cheat-bullshit","Bullshit Cheat","deduction",2,8,1,"Shedding","cards","Card shedding bluff with a giant call buzzer."],
    ["liars-dice-3d","Liars Dice 3D","deduction",2,6,0,"Pocket","dice","Enhanced 3D cup variant with dice loss tracking."],
    ["two-rooms-lite","Two Rooms Lite","deduction",6,16,0,"Hostages","rooms","President vs Bomber hostage split on one phone."],
    ["radio-morse-intercept","Morse Intercept","deduction",2,8,0,"Audio","radio","Web Audio coded transmission decoding."],
    ["wave-length-pocket","Wavelength","deduction",2,12,0,"Spectrum","dial","Binary psychic spectrum dial tuning."],
    ["space-team-relay","Spaceteam","deduction",2,8,0,"Co-op","rocket","Two-phone shouting bridge console relay."],
    
    /* ---- HIGH-ENERGY & DRINKING (14) ---- */
    ["kings-chalice","Kings Chalice","drinking",2,12,1,"Cards","cup","Digital Ring of Fire with a live chalice fill meter."],
    ["ride-the-bus","Ride The Bus","drinking",2,8,1,"Pyramid","pyramid","Fifteen-card pyramid match sudden death."],
    ["president-scum","President Scum","drinking",3,8,1,"Hierarchy","crown","Multi-round hierarchy card shedding."],
    ["higher-lower-death","Death Cards","drinking",2,8,1,"Streak","arrow","Accumulating pot higher/lower streak run."],
    ["truth-or-drink-vault","Truth Vault","drinking",2,12,1,"Vault","vault","Three-tier steel vault confession cards."],
    ["do-or-drink","Do Or Drink","drinking",2,12,1,"Dares","bolt","Tiered dare cards with scaling penalties."],
    ["most-likely-to","Most Likely To","drinking",3,12,1,"Poll","ballot","Anonymous hot-seat pointing ballots."],
    ["five-second-rule","5-Second Rule","drinking",3,10,1,"Trivia","clock","Name 3 items under rapid countdown."],
    ["bomb-countdown","Timebomb","drinking",3,12,1,"Fuse","bomb","Fast word pass with a detonating fuse."]
  ];

  const ALL_GAMES = RAW.map(r => ({
    id: r[0],
    title: r[1],
    category: r[2],
    minP: r[3],
    maxP: r[4],
    drink: !!r[5],
    tag: r[6],
    icon: ICONS[r[7]] || ICONS.ring,
    desc: r[8],
    path: `games/${r[0]}/index.html`
  }));

  /* ==================================================================
     INTEGRITY SELF-AUDIT
     ================================================================== */
  const AUDIT = (() => {
    const seen = {}, dupIds = [], badCat = [];
    const valid = CATS.map(c => c.key);
    ALL_GAMES.forEach(g => {
      if (seen[g.id]) dupIds.push(g.id); else seen[g.id] = 1;
      if (!valid.includes(g.category)) badCat.push(g.id);
    });
    return { total: ALL_GAMES.length, dupIds, badCat };
  })();

  if (AUDIT.dupIds.length) console.error("[PartyDeck] Duplicate IDs:", AUDIT.dupIds);
  $("hubModuleCount").textContent = `${AUDIT.total} OFFLINE MODULES`;

  /* ==================================================================
     RENDERING ENGINE
     ================================================================== */
  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" })[c]);
  }

  function renderCard(g) {
    return `
      <div class="game-card-compact" data-id="${esc(g.id)}" role="button" tabindex="0">
        <div class="card-top-badges">
          <span class="card-p-pill">
            <svg viewBox="0 0 24 24" ${SW}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
            ${g.minP}-${g.maxP}
          </span>
          ${g.drink ? '<span class="card-drink-dot" title="Drinking game"></span>' : ''}
        </div>
        <div class="card-center-icon">${g.icon}</div>
        <div class="card-compact-title">${esc(g.title)}</div>
        <span class="card-tag-pill">${esc(g.tag)}</span>
      </div>
    `;
  }

  function buildLanes() {
    let html = "";
    CATS.forEach(c => {
      const games = ALL_GAMES.filter(g => g.category === c.key);
      if (!games.length) return;
      html += `
        <section class="swimlane-section" data-lane="${c.key}">
          <div class="swimlane-header">
            <div class="swimlane-title-group">
              <span class="swimlane-ico">${ICONS[c.icon] || ""}</span>
              <h2 class="swimlane-title">${esc(c.label)}</h2>
            </div>
            <span class="swimlane-count">${games.length} GAMES</span>
          </div>
          <div class="swimlane-track">${games.map(renderCard).join("")}</div>
        </section>
      `;
    });
    $("laneHost").innerHTML = html;
  }
  buildLanes();

  /* ==================================================================
     QUICK-VIEW SHEET
     ================================================================== */
  const previewModal = $("previewModal");

  function openSheet(id) {
    const g = ALL_GAMES.find(x => x.id === id);
    if (!g) return;
    $("sheetIcon").innerHTML = g.icon;
    $("sheetTitle").textContent = g.title;
    $("sheetTagline").textContent = `${g.tag} · ${g.minP}-${g.maxP} players`;
    $("sheetDescription").textContent = g.desc;
    $("sheetBadgesRow").innerHTML = `
      <span class="sheet-pill">${g.minP}-${g.maxP} Players</span>
      <span class="sheet-pill">${esc(g.tag)}</span>
      ${g.drink ? '<span class="sheet-pill drink">Drinking Mode</span>' : ''}
    `;
    $("btnSheetLaunch").href = g.path;
    previewModal.classList.add("is-open");
  }

  function closeSheet() { previewModal.classList.remove("is-open"); }

  document.addEventListener("click", e => {
    const card = e.target.closest(".game-card-compact");
    if (card) openSheet(card.dataset.id);
  });

  document.addEventListener("keydown", e => {
    if (e.key === "Escape") closeSheet();
    if (e.key === "Enter" || e.key === " ") {
      const card = e.target.closest && e.target.closest(".game-card-compact");
      if (card) { e.preventDefault(); openSheet(card.dataset.id); }
    }
  });

  $("btnSheetClose").onclick = closeSheet;
  previewModal.onclick = e => { if (e.target === previewModal) closeSheet(); };

  /* ==================================================================
     SEARCH ENGINE
     ================================================================== */
  const searchInput = $("hubSearchInput");
  const searchSection = $("lane-search");
  const searchGrid = $("searchGrid");
  const searchClear = $("btnSearchClear");

  function setLanesVisible(v) {
    document.querySelectorAll("[data-lane]").forEach(el => {
      el.style.display = v ? "flex" : "none";
    });
  }

  searchInput.addEventListener("input", () => {
    const q = searchInput.value.trim().toLowerCase();
    if (!q) {
      searchClear.classList.remove("is-active");
      searchSection.style.display = "none";
      setLanesVisible(true);
      return;
    }
    searchClear.classList.add("is-active");
    setLanesVisible(false);
    searchSection.style.display = "block";

    const matches = ALL_GAMES.filter(g =>
      `${g.title} ${g.id} ${g.tag} ${g.desc}`.toLowerCase().includes(q)
    );

    $("searchMatchTitle").textContent = `Matches (${matches.length})`;
    searchGrid.innerHTML = matches.length
      ? matches.map(renderCard).join("")
      : `<div style="grid-column:1/-1;text-align:center;padding:2rem;color:var(--text-muted);font-family:var(--font-mono);font-size:.82rem;">No games match "${esc(q)}"</div>`;
  });

  searchClear.onclick = () => {
    searchInput.value = "";
    searchClear.classList.remove("is-active");
    searchSection.style.display = "none";
    setLanesVisible(true);
    searchInput.blur();
  };

  /* ==================================================================
     THEME SWITCHER
     ================================================================== */
  (() => {
    let saved = null;
    try { saved = localStorage.getItem("partydeck_theme"); } catch (e) {}
    if (!saved) return;
    document.documentElement.setAttribute("data-theme", saved);
    document.querySelectorAll(".theme-chip").forEach(chip => {
      chip.classList.toggle("is-active", chip.dataset.theme === saved);
    });
  })();

  $("themeStrip").addEventListener("click", e => {
    const chip = e.target.closest(".theme-chip");
    if (!chip) return;
    document.querySelectorAll(".theme-chip").forEach(c => c.classList.remove("is-active"));
    chip.classList.add("is-active");
    const theme = chip.dataset.theme;
    document.documentElement.setAttribute("data-theme", theme);
    try { localStorage.setItem("partydeck_theme", theme); } catch (err) {}
    showToast(`Theme: ${chip.textContent.trim()}`);
  });

  /* ==================================================================
     FULLSCREEN TOGGLE (iOS PWA Safe)
     ================================================================== */
  $("btnFullscreen").onclick = () => {
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    const standalone = window.navigator.standalone ||
      (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);

    if (isIOS) {
      showToast(standalone ? "Already running fullscreen." : "Share menu, then Add to Home Screen.");
      return;
    }
    const fsEl = document.fullscreenElement || document.webkitFullscreenElement;
    if (!fsEl) {
      const el = document.documentElement;
      const rfs = el.requestFullscreen || el.webkitRequestFullscreen;
      if (!rfs) { showToast("Fullscreen unsupported here."); return; }
      try {
        const p = rfs.call(el);
        if (p && typeof p.catch === "function") p.catch(() => showToast("Fullscreen blocked by browser."));
      } catch (err) { showToast("Fullscreen blocked by browser."); }
    } else {
      const efs = document.exitFullscreen || document.webkitExitFullscreen;
      if (efs) { try { efs.call(document); } catch (err) {} }
    }
  };

  /* ==================================================================
     ROSTER BRIDGE
     ================================================================== */
  function updateRosterBadge() {
    if (!window.PartyDeckAvatars) return;
    const r = window.PartyDeckAvatars.getRoster() || [];
    $("rosterBadgeCount").textContent = r.length;
  }

  $("btnOpenRoster").onclick = () => {
    if (!window.PartyDeckAvatars) { showToast("Avatar engine not loaded."); return; }
    window.PartyDeckAvatars.openRosterModal(roster => {
      updateRosterBadge();
      showToast(`${roster.length} players ready.`);
    });
  };

  window.addEventListener("partydeck:rosterupdated", updateRosterBadge);
  updateRosterBadge();

  /* ==================================================================
     LIVE VERIFIER (?verify=1)
     ================================================================== */
  function runVerifier() {
    const overlay = $("verifyOverlay");
    const body = $("verifyBody");
    overlay.classList.add("is-open");
    body.innerHTML = `<h3>PartyDeck Registry Report</h3><div class="v-dim">Probing ${ALL_GAMES.length} routes...</div>`;

    const results = [];
    let done = 0;

    ALL_GAMES.forEach(g => {
      fetch(g.path, { method: "HEAD", cache: "no-store" })
        .then(res => results.push({ g, ok: res.ok, code: res.status }))
        .catch(() => results.push({ g, ok: false, code: "ERR" }))
        .then(() => {
          done++;
          if (done === ALL_GAMES.length) paint(results);
        });
    });

    function paint(res) {
      const missing = res.filter(r => !r.ok);
      const live = res.filter(r => r.ok);

      let html = "<h3>PartyDeck Registry Report</h3>";
      html += `<div class="v-row">Registered modules: <strong>${AUDIT.total}</strong></div>`;
      html += `<div class="v-row">Duplicate IDs: <span class="${AUDIT.dupIds.length ? 'v-bad' : 'v-ok'}">${AUDIT.dupIds.length ? AUDIT.dupIds.join(", ") : "none"}</span></div>`;
      html += `<div class="v-row">Reachable routes: <span class="v-ok">${live.length}</span> of ${res.length}</div>`;

      if (missing.length) {
        html += `<h3 class="v-bad">Dead routes (${missing.length})</h3>`;
        missing.forEach(r => {
          html += `<div class="v-row v-bad">${esc(r.g.path)} [${r.code}]</div>`;
        });
      } else {
        html += `<h3 class="v-ok">All 43 routes successfully resolved!</h3>`;
      }

      body.innerHTML = html;
    }
  }

  $("btnVerifyClose").onclick = () => $("verifyOverlay").classList.remove("is-open");

  if (/[?&]verify=1/.test(window.location.search)) {
    runVerifier();
  }
})();
</script>

<script>
(function() {
  const STORAGE_KEY = "partydeck_qa_audit_log";
  let frameErrors = [];

  function getLogs() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"); } catch(e) { return []; }
  }
  function saveLogs(logs) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(logs)); } catch(e) {}
  }
  function updateBadge() {
    const badge = document.getElementById("pd-qa-badge");
    if (badge) badge.textContent = `${getLogs().length} Flagged`;
  }

  // Populate Dropdown from window.GAMES / ALL_GAMES / Card links
  function populateGames() {
    const select = document.getElementById("pd-rig-game-select");
    select.innerHTML = "";

    let list = [];
    if (window.ALL_GAMES && Array.isArray(window.ALL_GAMES)) {
      list = window.ALL_GAMES.map(g => ({ id: g.id, title: g.title || g.name || g.id, path: g.path || `games/${g.id}/index.html` }));
    } else if (window.GAMES && Array.isArray(window.GAMES)) {
      list = window.GAMES.map(g => ({ id: g.id, title: g.title || g.name || g.id, path: g.path || `games/${g.id}/index.html` }));
    } else {
      // Scrape game cards directly from the DOM if arrays aren't global
      const cards = document.querySelectorAll("[data-id], a[href*='games/']");
      const seen = new Set();
      cards.forEach(c => {
        const id = c.dataset.id || (c.getAttribute("href") || "").replace(/games\/([^/]+)\/?.*/, "$1");
        if (id && !seen.has(id) && id !== "#") {
          seen.add(id);
          list.push({ id: id, title: id, path: `games/${id}/index.html` });
        }
      });
    }

    if (!list.length) {
      list = [{ id: "custom", title: "Select Game or Type Path...", path: "games/" }];
    }

    list.forEach(g => {
      const opt = document.createElement("option");
      opt.value = g.path;
      opt.textContent = `${g.title} (${g.id})`;
      select.appendChild(opt);
    });
  }

  function loadSelectedGame() {
    const select = document.getElementById("pd-rig-game-select");
    const iframe = document.getElementById("pd-rig-frame");
    const path = select.value;

    frameErrors = [];
    document.getElementById("pd-rig-err-count").textContent = "0";
    document.getElementById("pd-rig-errors").textContent = "No JS runtime errors caught.";

    // Load game into frame
    iframe.src = path;

    // Prefill if previously logged
    const existing = getLogs().find(l => l.path === path || l.gameId === select.selectedOptions[0]?.textContent);
    document.getElementById("pd-rig-notes").value = existing ? existing.notes : "";
    document.querySelectorAll(".pd-rig-tag").forEach(cb => {
      cb.checked = existing ? (existing.tags || []).includes(cb.value) : false;
    });

    // Intercept errors inside iframe
    iframe.onload = function() {
      try {
        const frameWin = iframe.contentWindow;
        frameWin.addEventListener("error", function(e) {
          const err = `[Runtime Error] ${e.message} (${e.filename ? e.filename.split('/').pop() : 'script'}:${e.lineno})`;
          frameErrors.push(err);
          document.getElementById("pd-rig-err-count").textContent = frameErrors.length;
          document.getElementById("pd-rig-errors").textContent = frameErrors.join("\n\n");
        });
        frameWin.addEventListener("unhandledrejection", function(e) {
          const err = `[Promise Rejection] ${e.reason?.message || e.reason}`;
          frameErrors.push(err);
          document.getElementById("pd-rig-err-count").textContent = frameErrors.length;
          document.getElementById("pd-rig-errors").textContent = frameErrors.join("\n\n");
        });
      } catch(err) {
        // Cross-origin fallback
      }
    };
  }

  // Bind UI Events
  document.getElementById("pd-qa-fab").onclick = () => {
    populateGames();
    document.getElementById("pd-qa-rig-modal").style.display = "flex";
    loadSelectedGame();
    updateBadge();
  };

  document.getElementById("pd-rig-btn-close").onclick = () => {
    document.getElementById("pd-qa-rig-modal").style.display = "none";
    document.getElementById("pd-rig-frame").src = "about:blank";
  };

  document.getElementById("pd-rig-game-select").onchange = loadSelectedGame;
  document.getElementById("pd-rig-btn-reload").onclick = loadSelectedGame;

  // Save Flagged Game
  document.getElementById("pd-rig-btn-save").onclick = () => {
    const select = document.getElementById("pd-rig-game-select");
    const path = select.value;
    const gameName = select.selectedOptions[0]?.textContent || path;
    const tags = Array.from(document.querySelectorAll(".pd-rig-tag:checked")).map(cb => cb.value);
    const notes = document.getElementById("pd-rig-notes").value.trim();

    let logs = getLogs().filter(l => l.path !== path);
    logs.push({
      gameName: gameName,
      path: path,
      tags: tags,
      notes: notes || "No manual notes entered.",
      errors: [...frameErrors],
      timestamp: new Date().toLocaleTimeString()
    });
    saveLogs(logs);
    updateBadge();
    alert(`✅ Flagged "${gameName}" saved! Total in report: ${logs.length}`);
  };

  // Export Markdown Report
  document.getElementById("pd-rig-btn-export").onclick = () => {
    const logs = getLogs();
    if (!logs.length) return alert("No games flagged yet! Select broken games and click 'Flag Game'.");

    let md = `# 🛠️ PARTYDECK COMPREHENSIVE QA AUDIT & FIX REPORT\n`;
    md += `**Date:** ${new Date().toLocaleString()}\n`;
    md += `**Total Flagged Games:** ${logs.length}\n\n`;
    md += `## 📋 DIRECTIVES FOR LLM FIXES\n`;
    md += `Please rewrite the following broken PartyDeck games in full single-file implementations.\n`;
    md += `Ensure:\n`;
    md += `1. Root mobile container uses \`min-height: 100%; height: 100dvh; overflow-y: auto\`.\n`;
    md += `2. Canvas DPR scaling is active.\n`;
    md += `3. Audio uses Web Audio API synth tones.\n\n---\n\n`;

    logs.forEach((item, i) => {
      md += `### ${i + 1}. \`${item.path}\` — ${item.gameName}\n`;
      md += `- **Flaw Tags:** ${item.tags.join(", ") || "General Glitch"}\n`;
      md += `- **Observed Behavior:**\n  > ${item.notes.replace(/\n/g, "\n  > ")}\n`;
      if (item.errors.length) {
        md += `- **Captured JS Console Errors:**\n\`\`\`text\n${item.errors.join("\n")}\n\`\`\`\n`;
      } else {
        md += `- **Console Errors:** None caught (Layout / interaction issue).\n`;
      }
      md += `\n---\n\n`;
    });

    const blob = new Blob([md], { type: "text/markdown;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `PARTYDECK_BUG_AUDIT_${Date.now()}.md`;
    a.click();
  };

  // Clear Logs
  document.getElementById("pd-rig-btn-clear").onclick = () => {
    if (confirm("Clear all flagged game logs?")) {
      localStorage.removeItem(STORAGE_KEY);
      updateBadge();
      document.getElementById("pd-rig-notes").value = "";
      document.querySelectorAll(".pd-rig-tag").forEach(cb => cb.checked = false);
      alert("Audit list reset.");
    }
  };

  updateBadge();
})();
</script>
</body>
</html>
